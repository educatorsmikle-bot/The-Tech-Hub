'csec-it-number-systems':{o:['Convert between binary, denary and hexadecimal','Explain how characters are encoded using ASCII and Unicode','Describe how images, sound and video are stored digitally'],s:[
['Counting in binary',['A computer has two reliable states: current flowing or not. So it stores everything using binary — base 2 — where each digit (a bit) is 0 or 1. Eight bits make a byte, which can hold 256 different values.','Denary 13 is 1101 in binary because 8 + 4 + 1 = 13. Hexadecimal (base 16) is used as shorthand because one hex digit represents exactly four bits, so a byte is always two hex digits.'],['Binary places: 128, 64, 32, 16, 8, 4, 2, 1.','Hex digits: 0–9 then A=10, B=11, C=12, D=13, E=14, F=15.','Denary 200 = 11001000 in binary = C8 in hexadecimal.','1 byte = 8 bits; 1 KB = 1024 bytes; 1 MB = 1024 KB; 1 GB = 1024 MB.'],'Practise the conversion triangle until it is automatic — it appears in almost every data representation question.'],
['Text as numbers',['Each character is stored as a numeric code. ASCII uses 7 or 8 bits per character, enough for English letters, digits and punctuation. Unicode uses more bits so it can represent the characters of almost every written language, plus emoji.','Because every character has a fixed code, text files can be measured: a 500-character essay stored in 8-bit ASCII takes 500 bytes.']],
['Images, sound and video',['A bitmap image is a grid of pixels. Each pixel stores a colour, and the number of bits per pixel is the colour depth: 1 bit gives black and white, 8 bits gives 256 colours, 24 bits gives over 16 million.','Sound is sampled many times per second — the sample rate — and each sample is stored at a certain bit depth. Video is a sequence of frames shown fast enough to look continuous, usually 24 to 30 frames per second, paired with a sound track.'],['Larger images, higher colour depth and higher sample rates mean bigger files.','Compression reduces file size: lossless keeps every detail, lossy throws some away.','MP3 and JPEG are lossy; PNG and FLAC are lossless.']]],
k:[['Bit','A single binary digit, 0 or 1 — the smallest unit of data.'],['Colour depth','The number of bits used to store the colour of one pixel.'],['Sample rate','How many times per second an analogue sound wave is measured when digitised.'],['Compression','Reducing file size by encoding data more efficiently, either losslessly or lossily.']],e:'Show your working for conversions. Marks are usually given for the method, not just the final answer.'},

['The threats',['Malware is any software written to cause harm: viruses attach to files, worms spread across networks on their own, trojans hide inside useful-looking programs, spyware watches what you do and ransomware encrypts your files and demands payment.','Phishing tricks people into revealing passwords by imitating a trusted message. Pharming redirects a user to a fake site without their knowledge. Social engineering targets people rather than machines — a caller claiming to be from the bank is often more effective than any exploit.'],['Hacking is unauthorised access to a system; a denial-of-service attack floods a service until it fails.','Data interception means reading traffic in transit, especially on unsecured Wi-Fi.','Insider threats come from staff who misuse legitimate access.']],
['The defences',['Security is layered. Physical measures include locked server rooms, cable locks, CCTV and restricted access. Software measures include firewalls that filter traffic, antivirus and anti-spyware tools, encryption that makes stolen data unreadable, and multi-factor authentication that requires more than a password.','Processes matter just as much: regular backups stored off-site, automatic updates to patch known holes, the principle of least privilege so users only get the access they need, and a clear acceptable-use policy.'],['Strong passwords are long, unique and never reused across accounts.','Encryption protects data at rest and in transit; a password protects access.','A backup you have never restored is not a backup you can rely on.']],
['Law and responsibility',['Data protection legislation sets rules for how personal data may be collected, stored and shared: collect only what is needed, tell people why, keep it accurate, keep it secure and do not keep it longer than necessary. Computer misuse laws criminalise unauthorised access and damage.'],null,'In the Caribbean, the Data Protection Act (Jamaica) and similar regional legislation place duties on organisations that hold personal data.']],
k:[['Malware','Software written to damage, disrupt or gain unauthorised access to a system.'],['Phishing','Fraudulently obtaining information by pretending to be a trusted organisation.'],['Encryption','Scrambling data so only someone with the key can read it.'],['Firewall','Hardware or software that filters network traffic against security rules.']],e:'For “describe two ways to protect data”, give a measure plus how it works — “encryption makes the file unreadable without the key” earns more than “use encryption”.'},
'csec-it-hardware-and-software':{o:['Identify the main hardware components and their functions','Distinguish system software from application software','Explain the fetch–decode–execute cycle in simple terms'],s:[
['The physical machine',['Hardware is everything you can physically touch. A desktop computer, a laptop, a tablet and a smartphone are all built from the same basic set of components, just at different sizes and prices.','The processor (CPU) carries out instructions. RAM holds the programs and data currently in use, and it is volatile — switch off the power and its contents disappear. Storage such as a hard disk, SSD or memory card keeps data permanently, even with no power.'],['Input devices bring data in: keyboard, mouse, scanner, microphone, touchscreen, sensors.','Output devices send results out: monitor, printer, speakers, projector.','Storage devices keep data for later: SSD, hard disk, USB flash drive, memory card.','Peripherals are any device attached to the system unit — input, output or storage.']],
['Software: instructions, not parts',['Software is the set of instructions that tells the hardware what to do. Without software a computer is just an expensive arrangement of metal and plastic.','System software manages the machine itself. The operating system — Windows, macOS, Linux, Android or iOS — controls memory, files, devices and security, and gives application software a platform to run on. Utility programs such as antivirus tools, backup software and disk clean-up tools also count as system software.'],['Application software performs a task for the user: word processors, spreadsheets, browsers, photo editors, games.','General-purpose applications can do many jobs; special-purpose applications are built for one task, like a payroll system or a school timetable generator.','Firmware is software stored on a chip, such as the BIOS that starts a computer.'],'A common exam trap: an operating system is not an application. It is system software that lets applications run.'],
['How it all runs together',['When you open a program, the operating system loads it from storage into RAM. The CPU then repeatedly fetches an instruction, decodes what it means, executes it, and stores the result. This fetch–decode–execute cycle repeats billions of times per second.','A faster CPU, more RAM and faster storage all shorten the time between your click and the result on screen. That is why a machine with plenty of RAM still feels fast with many browser tabs open.']]],
k:[['CPU','The central processing unit — the chip that fetches, decodes and executes instructions.'],['RAM','Random access memory: fast, volatile working memory that holds programs and data in use.'],['Operating system','System software that manages hardware, files, memory and devices, and runs applications.'],['Peripheral','Any device connected to the system unit for input, output or storage.']],e:'When asked to compare RAM and ROM, always mention volatility, purpose and whether the user can change the contents.'},
'csec-it-data-and-information':{o:['Distinguish data, information and knowledge','Describe the characteristics of good information','Explain validation and verification with examples'],s:[
['From facts to decisions',['Data is a collection of raw, unprocessed facts: 27, 4, 91. On its own it means very little. When data is processed, organised and given context it becomes information: “27 students scored above 80 in the March test”.','Knowledge is what you do with that information — deciding to run a revision session for the four students who scored below 50. Information systems exist to move an organisation along that chain quickly and accurately.'],['Good information is accurate, timely, relevant, complete, concise and presented clearly.','Information that arrives late is often worthless — a stock alert after the shop has sold out.','Garbage in, garbage out: poor input data produces poor decisions.']],
['Validation and verification',['Validation checks whether data is reasonable before it is accepted. A date-of-birth field that rejects a year of 1899 is validating. Verification checks whether data has been copied correctly — typing a password twice, or scanning a barcode instead of keying the number.'],['Range check: a mark must be between 0 and 100.','Presence check: a name field cannot be left empty.','Format check: a phone number must be 10 digits.','Data type check: an age field must not accept letters.','Check digit: the final digit of an ID number is calculated from the others to catch typing errors.'],'Validation cannot catch a plausible wrong value — a mistyped but valid date still passes. That is why verification exists.']],
k:[['Data','Raw, unprocessed facts with no meaning on their own.'],['Information','Processed data given context so it is meaningful to a person.'],['Validation','Automatic checks that input data is reasonable and within acceptable rules.'],['Verification','Checks that data has been entered or transferred accurately.']],e:'When a question asks for “two validation checks”, name the check and give a specific rule for the field — vague answers lose marks.'},
'csec-it-spreadsheets-and-databases':{o:['Write formulas using cell references, absolute references and functions','Explain what-if analysis and absolute cell referencing','Describe the structure of a database and the purpose of a primary key'],s:[
['Spreadsheets as models',['A spreadsheet is a grid of cells addressed by column and row: B4, F12. A formula begins with = and recalculates automatically when the values it depends on change. That is what makes a spreadsheet a model — you change one assumption and instantly see the effect.','Relative references such as B4 shift when a formula is copied. Absolute references such as $B$4 stay fixed, which is essential when every row multiplies by the same tax rate held in one cell.'],['=SUM(B2:B20) adds a range; =AVERAGE(C2:C20) finds the mean.','=IF(D2>=50,"Pass","Fail") makes a decision.','=COUNTIF(E2:E100,"Kingston") counts matching entries.','=VLOOKUP(A2,$G$2:$H$10,2,FALSE) looks a value up in a table.','Charts turn numbers into a visual that a reader can interpret at a glance.']],
['Databases: organised data',['A database stores related data in tables. Each table is made of records (rows) and fields (columns). A field holds one piece of data about one item, such as a student surname or a date of birth.','The primary key uniquely identifies each record — a student ID rather than a name, because two students can share a name. A foreign key in another table points back to that primary key to link the tables together, which is how a school links students to their classes without repeating every student detail in every row.'],['A flat-file database keeps everything in one table; a relational database splits data into linked tables.','Splitting data into linked tables reduces duplication and prevents inconsistencies.','A query asks a question of the data, such as “all students in Grade 11 with a mark below 50”.','A report presents query results in a printable, formatted layout.'],'Know the vocabulary cold: table, record, field, primary key, foreign key, query, report, form.']],
k:[['Absolute reference','A cell reference fixed with $ signs so it does not change when copied.'],['Record','One complete row of data about a single item in a table.'],['Primary key','A field that uniquely identifies each record in a table.'],['Query','A request for data that matches specified criteria.']],e:'Spreadsheet questions often ask you to name a function for a task — learn SUM, AVERAGE, IF, COUNTIF, MAX, MIN and VLOOKUP by purpose.'},
'csec-it-networks':{o:['Compare LAN and WAN with examples','Describe star, bus and ring topologies with advantages and disadvantages','Compare wired and wireless transmission media'],s:[
['Why networks exist',['A network connects devices so they can share data, hardware and an internet connection. A local area network (LAN) covers one building or campus, like a school computer lab. A wide area network (WAN) spans large distances and links LANs together — the internet is the largest WAN.','Networks need hardware: a router to connect networks and direct traffic, a switch to connect devices within a LAN, a network interface card in each device, and cabling or wireless access points.'],['Advantages: shared resources, central data storage, cheaper software licences, easy communication.','Disadvantages: setup cost, dependence on the network, malware spreads faster, need for a network administrator.']],
['Topologies',['A star topology connects every device to a central switch or hub. It is the most common layout because a single cable failure only affects one device, and faults are easy to trace. Its weakness is that the central device is a single point of failure.','A bus topology uses one backbone cable with all devices tapping in. It needs less cable but a break in the backbone brings the whole network down and performance drops as traffic increases. A ring passes data from device to device in a loop, which is predictable but slow to recover from a failure.']],
['Wired or wireless',['Wired media — copper cable such as UTP, or fibre optic — offers high speed and stability. Fibre carries data as light and is immune to electrical interference, which is why it is used for long runs and high-bandwidth links.','Wireless media uses radio waves, giving mobility and cheap installation but with more interference, weaker security and lower speeds over distance.'],['Bandwidth is the amount of data a channel can carry per second; latency is the delay before data arrives.','A hotspot shares one internet connection wirelessly; tethering shares a phone connection.','Bluetooth is for short-range device pairing, not for building a LAN.']]],
k:[['LAN','A network covering a small area such as one building or campus.'],['Star topology','A layout where every device connects to a central switch or hub.'],['Bandwidth','The maximum amount of data a connection can carry per second.'],['Fibre optic','Cable that transmits data as pulses of light, fast and immune to interference.']],e:'Topology questions almost always want one advantage and one disadvantage — link each to a real situation, not just “it is fast”.'},
'csec-it-internet-and-ecommerce':{o:['Explain the difference between the internet and the World Wide Web','Identify the parts of a URL and how a browser loads a page','Describe the benefits and risks of e-commerce'],s:[
['Internet vs web',['The internet is the global network of networks — the infrastructure. The World Wide Web is one service that runs on it: pages linked by hyperlinks and requested using HTTP or HTTPS. Email, instant messaging and video calls are separate services that also use the internet.','Every device on the internet has an IP address. Because people remember names better than numbers, the Domain Name System (DNS) translates a name like example.com into the IP address the browser actually contacts.'],['URL parts: protocol (https), domain (moe.gov.jm), path (/exams), and sometimes a query string.','A browser requests a page, the server responds with HTML, CSS and images, and the browser renders them.','HTTPS encrypts the connection, protecting passwords and payment details.']],
['E-commerce and online services',['E-commerce is buying and selling using the internet — online banking, booking a flight, ordering from a local store, or paying school fees. It removes distance: a small business in Montego Bay can sell to a customer in Trinidad without opening a branch.'],['Benefits for business: wider market, lower premises cost, 24-hour trading, data on customer behaviour.','Benefits for customers: convenience, price comparison, home delivery, wider choice.','Risks: fraud, fake sellers, card details stolen, goods that do not arrive, no chance to inspect before paying.','Trust signals matter: padlock and HTTPS, clear return policy, reviews, real contact details.'],'E-commerce covers any commercial transaction online. M-commerce is the same activity done through a mobile device.']],
k:[['DNS','The system that translates a domain name into an IP address.'],['HTTPS','The encrypted version of HTTP used for secure web transactions.'],['E-commerce','Buying and selling goods or services over the internet.']],e:'Distinguish the internet from the web clearly in one sentence each — examiners look for the infrastructure-versus-service distinction.'},
'cape-cs-algorithms-and-complexity':{o:['Define an algorithm and its required properties','Write pseudocode for sequence, selection and iteration','Compare linear and binary search using Big-O'],s:[
['What an algorithm must be',['An algorithm is a finite sequence of unambiguous steps that solves a problem. It must be precise, have a defined input and output, terminate, and be effective — each step must be something that can actually be carried out.','Pseudocode expresses an algorithm in structured English with keywords like IF, WHILE, FOR and RETURN. It is language-independent, so the logic can be checked before any syntax gets in the way. A trace table records the value of each variable after every step, which is how you prove an algorithm behaves correctly.'],['Sequence: steps in order. Selection: IF…THEN…ELSE. Iteration: FOR and WHILE loops.','Every loop needs a condition that eventually becomes false, or it will not terminate.','Dry running with a trace table catches off-by-one errors early.']],
['Searching and sorting',['Linear search checks items one at a time until it finds a match — simple, works on unsorted data, but slow on large lists. Binary search repeatedly halves a sorted list, which finds an item in far fewer comparisons but requires the data to be sorted first.','Sorting algorithms trade speed against memory and simplicity: bubble sort is easy to write but slow, while merge sort and quicksort are far faster on large data sets.']],
['Big-O: describing growth',['Big-O notation describes how the work an algorithm does grows as the input size n grows. It ignores constants and focuses on the shape of the curve.'],['O(1) constant — array index lookup, regardless of size.','O(log n) logarithmic — binary search.','O(n) linear — linear search, one pass through a list.','O(n log n) — efficient comparison sorts such as merge sort.','O(n²) quadratic — bubble and selection sort; fine for 50 items, painful for 50,000.'],'A program that is correct but O(n²) can be unusable on real data. Efficiency is part of the solution, not an afterthought.']],
k:[['Algorithm','A finite, unambiguous sequence of steps that solves a problem.'],['Trace table','A table recording variable values after each step, used to dry run an algorithm.'],['Big-O notation','A description of how an algorithm’s running time grows with input size.']],e:'When comparing search algorithms, always state the precondition: binary search needs sorted data, and sorting costs time.'},
'cape-cs-programming-constructs':{o:['Declare and use variables of appropriate data types','Write code using sequence, selection and iteration','Explain the difference between passing by value and by reference'],s:[
['Data and variables',['A variable is a named store whose value can change. Its data type decides what it can hold and how much memory it needs: integer, real, boolean, character and string are the basics, with arrays for collections of the same type.','A constant is a named value that does not change, such as a tax rate. Naming things clearly and declaring types explicitly prevents a whole class of bugs.'],['Integer: whole numbers. Real: numbers with decimals.','Boolean: TRUE or FALSE. Character: a single symbol. String: a sequence of characters.','Local variables exist only inside their subprogram; global variables are visible everywhere, which makes programs harder to reason about.']],
['Control structures',['Selection chooses a path: IF…THEN…ELSEIF…ELSE, or CASE for many fixed options. Iteration repeats work: a FOR loop when the number of repetitions is known, a WHILE loop when it depends on a condition, and a REPEAT…UNTIL loop that always runs at least once.','Nested structures combine them — a loop inside a loop to search a grid, for example — but deep nesting hurts readability, which is why breaking work into subprograms matters.']],
['Subprograms and parameters',['A function returns a value; a procedure performs an action. Both take parameters so they can be reused with different data, and both hide detail behind a name — you call calculateAverage(marks) without caring how it works inside.','Passing by value sends a copy, so the original variable is unchanged. Passing by reference sends the address, so the subprogram can modify the caller’s variable. Recursion is a subprogram calling itself, and every recursive solution needs a base case or it will overflow the stack.'],null,'Recursion vs iteration: recursion is elegant for tree-shaped problems, but each call uses stack memory.']],
k:[['Parameter','A value passed into a subprogram so it can work on different data.'],['Pass by value','Passing a copy of a value, leaving the original unchanged.'],['Recursion','A subprogram that calls itself, with a base case to stop.']],e:'In code questions, marks are awarded for correct logic, then for correct syntax. Comment your pseudocode so the examiner can follow the logic.'},
'cape-cs-data-structures':{o:['Describe static and dynamic data structures','Explain stack (LIFO) and queue (FIFO) behaviour with examples','Describe how a binary search tree organises data'],s:[
['Arrays and lists',['An array stores a fixed number of items of the same type in consecutive memory, accessed by index — so reading any element is O(1). A one-dimensional array is a list; a two-dimensional array is a table of rows and columns.','A linked list stores each item in a node with a pointer to the next, so it can grow and shrink freely and inserting in the middle is cheap — but you cannot jump straight to the fifth item, you must walk the chain.'],['Array: fixed size, fast random access, expensive to insert or delete in the middle.','Linked list: dynamic size, cheap insertion, slow sequential access.']],
['Stacks and queues',['A stack is last in, first out (LIFO): push adds to the top, pop removes from the top. Undo history, the back button and the call stack all behave this way.','A queue is first in, first out (FIFO): enqueue at the back, dequeue from the front. Print jobs, message queues and customer service lines are queues. A priority queue serves the highest-priority item first regardless of arrival order.']],
['Trees and hash tables',['A binary search tree stores each value in a node, with smaller values to the left and larger to the right. Searching, inserting and deleting are O(log n) when the tree is balanced, which makes trees excellent for ordered data and for representing hierarchies such as file systems.','A hash table maps a key to a location using a hash function, giving near-constant O(1) lookup — the reason dictionaries and database indexes feel instant.'],null,'Choose a structure from the operations you need: frequent search on sorted data suggests a tree or hash table; first-come-first-served suggests a queue.']],
k:[['LIFO','Last in, first out — the order a stack operates in.'],['FIFO','First in, first out — the order a queue operates in.'],['Binary search tree','A tree where left children are smaller and right children are larger than their parent.']],e:'Be ready to draw a stack or tree after a sequence of operations — draw it step by step and label the final state.'},
'cape-cs-computer-architecture':{o:['Describe the von Neumann architecture and its components','Explain the fetch–decode–execute cycle using registers','Explain the purpose of cache memory'],s:[
['The von Neumann model',['In the von Neumann architecture, program instructions and data share the same memory and travel on the same bus to the processor. The CPU contains the control unit, which directs operations, and the arithmetic logic unit (ALU), which performs calculations and comparisons.','Registers are tiny, extremely fast stores inside the CPU: the program counter holds the address of the next instruction, the instruction register holds the instruction being decoded, and the accumulator holds intermediate results.'],['The control unit fetches, decodes and coordinates; the ALU executes.','The data bus carries data, the address bus carries locations, the control bus carries signals.','The von Neumann bottleneck is the limit imposed by sharing one bus between instructions and data.']],
['Fetch, decode, execute',['The cycle repeats continuously: fetch the instruction at the address in the program counter, increment the program counter, decode the instruction in the control unit, execute it in the ALU, then store any result back to memory or a register.','Pipelining overlaps these stages across instructions so that while one instruction executes, the next is being decoded — a key reason modern processors are fast.']],
['The memory hierarchy',['Storage is arranged in a hierarchy that trades capacity for speed. Registers are fastest and smallest, then cache, then RAM, then SSD and hard disk, then off-site storage.','Cache holds recently and frequently used data close to the CPU. A cache hit avoids a slow trip to RAM; a cache miss costs time. This is why an algorithm that accesses memory in a predictable order often runs faster in practice.'],null,'Know the difference between volatile memory (RAM, loses contents on power loss) and non-volatile storage (SSD, keeps data).']],
k:[['ALU','The arithmetic logic unit — the part of the CPU that performs calculations and comparisons.'],['Program counter','A register holding the address of the next instruction to fetch.'],['Cache','Small, fast memory close to the CPU holding frequently used data.']],e:'If asked to describe the fetch–decode–execute cycle, name the registers involved — that is where the marks are.'},
'cape-cs-networks-and-protocols':{o:['Describe the purpose of layered protocol models','Explain the roles of TCP, IP, HTTP and DNS','Distinguish IPv4 from IPv6 and public from private addresses'],s:[
['Why layers',['Networking is organised in layers so each one can be designed and replaced independently. The TCP/IP model has four: application, transport, internet and network access. The OSI reference model splits the same job into seven layers for teaching and troubleshooting.','When you load a web page, HTTP works at the application layer, TCP breaks the data into segments at the transport layer, IP addresses and routes packets at the internet layer, and the network access layer puts them on the wire.'],['Application: HTTP, HTTPS, SMTP, FTP, DNS.','Transport: TCP (reliable, ordered, connection-oriented) and UDP (fast, no guarantees).','Internet: IP addressing and routing between networks.','Network access: Ethernet, Wi-Fi and the physical media.']],
['Packets and protocols',['Data is split into packets, each carrying source and destination addresses. Routers forward packets hop by hop; TCP at the destination reassembles them in order and requests retransmission of anything lost. UDP skips that safety net, which is why live video prefers it.','A protocol is an agreed set of rules for communication. Without agreement on format, order and error handling, two devices cannot exchange anything meaningful.']],
['Addressing',['IPv4 uses 32-bit addresses such as 192.168.1.20; IPv6 uses 128 bits, which solves the exhaustion of IPv4 addresses. Private addresses are used inside a LAN and translated to a public address by NAT when traffic leaves the network.','A subnet mask separates the network portion of an address from the host portion, and a default gateway is the router a device sends off-network traffic to.'],null,'A MAC address identifies a network interface permanently; an IP address identifies a device’s location on a network and can change.']],
k:[['Protocol','An agreed set of rules governing how data is exchanged between devices.'],['TCP','A reliable, connection-oriented transport protocol that guarantees ordered delivery.'],['NAT','Network address translation — mapping private addresses to a public one.']],e:'Match the protocol to the task: HTTP for web pages, SMTP for sending mail, FTP for file transfer, DNS for name resolution.'},
'cape-cs-databases-and-sql':{o:['Explain the purpose of normalisation up to third normal form','Identify entities, attributes and relationships in a scenario','Write SQL to select, filter, sort and aggregate data'],s:[
['Modelling the data',['A relational database stores data in tables linked by keys. To design one, identify the entities in the scenario (Student, Course, Teacher), their attributes, and the relationships between them — one-to-many, many-to-many, or one-to-one.','A many-to-many relationship cannot be stored directly; it needs a linking table holding the keys of both sides, such as an Enrolment table linking Student and Course.']],
['Normalisation',['Normalisation removes redundancy and the update anomalies that come with it. First normal form removes repeating groups so every field holds a single value. Second normal form removes partial dependencies on part of a composite key. Third normal form removes transitive dependencies, where a non-key field depends on another non-key field.','The practical test is simple: if changing one fact means updating it in several places, the design is not normalised.'],['1NF: atomic values, no repeating groups, a primary key.','2NF: no partial dependencies on a composite key.','3NF: no non-key field depending on another non-key field.','Denormalisation is sometimes used deliberately in reporting systems to speed up reads.']],
['Querying with SQL',['SQL is the standard language for relational databases. SELECT chooses columns, FROM names the table, WHERE filters rows, GROUP BY collects rows for aggregation, HAVING filters the groups, and ORDER BY sorts the output.'],['SELECT name, mark FROM Student WHERE mark >= 50 ORDER BY mark DESC;','SELECT course_id, AVG(mark) FROM Enrolment GROUP BY course_id HAVING AVG(mark) > 70;',"INSERT INTO Student (name, mark) VALUES ('Alicia', 88);",'UPDATE Student SET mark = 90 WHERE student_id = 12;','JOIN combines related tables: SELECT s.name, c.title FROM Student s JOIN Enrolment e ON s.id = e.student_id JOIN Course c ON c.id = e.course_id;'],'WHERE filters individual rows before grouping; HAVING filters groups after aggregation.']],
k:[['Normalisation','Organising tables to reduce redundancy and prevent update anomalies.'],['Foreign key','A field in one table that references the primary key of another, creating a link.'],['JOIN','An SQL operation combining rows from related tables on a matching key.']],e:'For a normalisation question, list the dependencies first — it makes the anomalies and the fix obvious.'},
'cape-it-information-systems':{o:['Identify the components of an information system','Distinguish TPS, MIS, DSS and EIS by purpose and user','Explain how IT creates competitive advantage'],s:[
['What makes a system',['An information system is more than hardware. It combines people, procedures, data, software, hardware and networks to collect, process, store and distribute information that supports decisions.','People are the most overlooked component: a system with excellent software but untrained staff will fail. Procedures are the documented rules for using the system consistently.'],['Input: data captured from transactions, forms, sensors or other systems.','Processing: validation, calculation, sorting, aggregation.','Output: reports, dashboards, alerts, invoices.','Feedback: output that adjusts the input or process — a stock alert that triggers a reorder.']],
['Systems at different levels',['Organisations need different information at different levels. Operational staff need detailed, immediate, transaction-level data. Middle managers need summaries and comparisons. Senior management needs trends and exceptions.'],['Transaction processing system (TPS): records routine daily transactions — sales, payments, registrations.','Management information system (MIS): summarises TPS data into scheduled reports for managers.','Decision support system (DSS): interactive modelling for semi-structured decisions, such as “what if we raise prices 10%?”','Executive information system (EIS): high-level dashboards for strategic monitoring.','Expert system: applies rules to imitate a specialist, such as fault diagnosis.'],'A TPS serves operations; a DSS serves judgement. Knowing which level a scenario describes is usually the whole question.'],
['IT as an advantage',['IT creates advantage when it lowers cost, differentiates a product, or locks in customers through convenience — a loyalty app that stores purchase history makes switching inconvenient. The advantage is temporary unless the organisation keeps improving, because competitors can buy the same technology.']]],
k:[['Information system','People, procedures, data, software, hardware and networks working together to provide useful information.'],['TPS','A transaction processing system that records routine day-to-day transactions.'],['DSS','A decision support system that lets users model scenarios and explore alternatives.']],e:'When classifying a system, name the user level first — operational, tactical or strategic — then justify with the data it uses.'},
'cape-it-systems-development-lifecycle':{o:['List and describe the stages of the SDLC','Compare waterfall, prototyping and agile approaches','Explain the purpose of a feasibility study'],s:[
['The stages',['The systems development lifecycle is the structured process for building an information system. Each stage produces a document that feeds the next, which makes progress visible and errors cheaper to catch early.'],['1. Identification of need — the problem or opportunity is defined.','2. Feasibility study — is it technically, economically, legally and operationally viable?','3. Analysis — gather requirements through interviews, questionnaires, observation and document review.','4. Design — data models, screen layouts, reports, hardware and software specification.','5. Development — build or configure the system, then test it.','6. Implementation — data migration, staff training, changeover from the old system.','7. Maintenance — fix faults, adapt to new requirements, improve performance.']],
['Choosing an approach',['Waterfall moves through the stages once, with heavy documentation and sign-off. It suits stable, well-understood requirements and regulated environments, but it handles change badly.','Prototyping builds a working model quickly so users can react to something concrete, refining requirements through iterations. Agile delivers small increments in short cycles with continuous feedback, which suits projects where requirements will evolve.'],['Changeover methods: direct (risky, cheap), parallel (safe, costly), phased (balanced), pilot (one department first).','A post-implementation review checks whether the system actually delivered the intended benefits.'],'Maintenance usually consumes the largest share of a system’s total cost over its life.']],
k:[['Feasibility study','An assessment of whether a proposed system is technically, economically, legally and operationally viable.'],['Prototype','An early working model of a system used to clarify requirements.'],['Parallel changeover','Running the old and new systems together until the new one is proven.']],e:'Name the stage, say what happens in it and what it produces. “Analysis” alone earns little; “analysis, where requirements are gathered through interviews, producing a requirements specification” earns full marks.'},
'cape-cs-data-representation-and-logic':{o:['Represent negative integers using two’s complement','Explain overflow and the limits of fixed-width representation','Construct truth tables and simplify Boolean expressions'],s:[
['Integers and negatives',['An 8-bit unsigned integer holds 0 to 255. To store negatives, two’s complement uses the most significant bit as a sign: invert all bits of the positive value and add one. So 5 (00000101) becomes −5 (11111011).','Adding beyond the range causes overflow — for example, 200 + 100 in 8-bit unsigned arithmetic wraps around instead of giving 300. Programmers must know the width of their types to avoid this.'],['n bits represent 2ⁿ values; signed ranges run from −2ⁿ⁻¹ to 2ⁿ⁻¹ − 1.','Two’s complement lets the same adder circuit handle addition and subtraction.','Floating point stores very large and very small numbers with limited precision, which is why 0.1 + 0.2 is not exactly 0.3 in binary.']],
['Characters, images and sound',['ASCII covers 128 characters in 7 bits; Unicode extends this to tens of thousands of code points so one document can mix scripts. UTF-8 stores common characters in one byte and rarer ones in more, which keeps English text compact.','Images store colour values per pixel; sound stores amplitude samples; both can be compressed lossily or losslessly depending on whether exact fidelity matters.']],
['Boolean logic',['Logic gates implement Boolean operations: AND is true only when both inputs are true, OR when at least one is, NOT inverts, XOR when exactly one is true, and NAND/NOR are the inverted forms.','Any Boolean expression can be turned into a truth table and then into a circuit, and any circuit can be reduced using rules such as De Morgan’s laws: NOT(A AND B) = (NOT A) OR (NOT B). Simplifying a circuit reduces the gates, cost and delay.'],null,'NAND and NOR are called universal gates because either one alone can build every other gate.']],
k:[['Two’s complement','A method of representing negative integers by inverting bits and adding one.'],['Overflow','A result too large to be represented in the available number of bits.'],['De Morgan’s laws','Rules for rewriting negated AND/OR expressions: NOT(A AND B) = NOT A OR NOT B.']],e:'Always draw the full truth table with every input combination — 2ⁿ rows for n inputs.'}};
