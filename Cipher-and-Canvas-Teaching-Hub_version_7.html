'cape-it-databases-and-data-modelling':{o:['Draw an entity–relationship diagram from a business scenario','Identify primary, foreign and composite keys and explain integrity rules','Normalise an unnormalised table to third normal form'],s:[
['Entities, attributes and relationships',['Data modelling starts on paper, not in software. An entity is a thing the organisation needs to keep data about — Customer, Order, Product. An attribute is a fact about it, such as a customer’s name or an order date. A relationship describes how two entities connect: a customer places many orders, but each order belongs to one customer.','An entity–relationship diagram (ERD) draws entities as boxes and relationships as lines labelled with their cardinality. Getting the diagram right before building anything is far cheaper than restructuring a live database.'],['One-to-one (1:1): one employee has one staff ID card.','One-to-many (1:N): one customer places many orders — the most common relationship.','Many-to-many (M:N): many students take many subjects; resolved with a linking table.','Optional versus mandatory participation: must every order have a customer? Usually yes.']],
['Keys and integrity',['A primary key uniquely identifies each record and can never be empty or duplicated. When no single field is unique, a composite key combines two or more fields — for example OrderID plus ProductID in an order-line table. A foreign key is a field that holds the primary key of a related table, and it is what actually creates the link.','Integrity rules keep the data trustworthy. Entity integrity says every primary key must be present and unique. Referential integrity says a foreign key must match an existing primary key, so you cannot record an order for a customer who does not exist.'],['Candidate key: any field that could serve as the primary key.','Surrogate key: an artificial ID (such as an auto-number) used when no natural key is reliable.','Cascading delete removes dependent records automatically — powerful but dangerous.'],'Never use a name as a primary key. Names change and are shared; IDs are unique and stable.'],
['Normalisation in practice',['Imagine an order sheet that repeats the customer’s name, address and phone number on every line, and lists several products in one cell. Change the customer’s address and you must hunt through every row — miss one and the data contradicts itself. Normalisation fixes this in steps.','First normal form (1NF): one value per cell and no repeating groups. Second normal form (2NF): every non-key field depends on the whole key, not just part of it. Third normal form (3NF): non-key fields depend only on the key, not on each other. The result is that each fact is stored once, in the table where it belongs.'],['Unnormalised: Order(OrderID, CustName, CustPhone, Items…)','1NF: split Items into separate rows, one product per row.','2NF: move product details out, because they depend on ProductID alone.','3NF: move customer details to a Customer table, because CustPhone depends on the customer, not the order.']],
['The DBMS and the people around it',['A database management system (DBMS) sits between users and the data. It enforces integrity rules, controls who can see what, handles several users at once and manages backup and recovery. The data dictionary records the structure: table names, field names, data types and constraints.','Several roles keep it running: the database administrator designs, secures and tunes the system; developers write the programs that use it; end users enter and retrieve data through forms and reports.']]],
k:[['Entity','Something about which an organisation stores data, such as a customer or a product.'],['Cardinality','The number of records on each side of a relationship: one-to-one, one-to-many or many-to-many.'],['Referential integrity','A rule that every foreign key value must match an existing primary key.'],['Data dictionary','A record of the structure of a database: tables, fields, data types and constraints.']],e:'Draw the ERD first and label every relationship with its cardinality. Marks are given for entities, relationships and keys, in that order.'},
'cape-it-spreadsheets-and-decision-support':{o:['Build a what-if model with clearly separated inputs, calculations and outputs','Choose suitable functions for lookup, conditional and financial tasks','Explain the limits of a spreadsheet compared with a database'],s:[
['Modelling a decision',['A decision-support spreadsheet separates three things: inputs (assumptions you can change, such as price and expected sales), calculations (formulas that depend on the inputs) and outputs (the profit or total the decision-maker cares about). Because every formula refers to the input cells, changing one assumption updates the whole model at once.','What-if analysis asks “what happens to profit if we raise the price by 10%?” by changing an input and watching the output. Goal seek works backwards: you set the target — say a profit of $50,000 — and the spreadsheet finds the input value needed to hit it. Scenario tables place best, expected and worst cases side by side so a manager can compare them.'],['Keep assumptions in labelled cells at the top, never buried inside formulas.','Use absolute references ($B$2) for fixed inputs and relative ones for row-by-row calculations.','Name important cells (TaxRate) so formulas read like sentences.','Sensitivity analysis changes one input at a time to see which assumption matters most.']],
['Functions that do the heavy lifting',['Business models lean on a small toolkit of functions. Conditional functions summarise only the rows that meet a rule; lookup functions pull a value from a reference table; financial functions turn loans and investments into repayments and returns.'],['=SUMIF(B2:B100,"Kingston",D2:D100) adds the sales for one branch.','=COUNTIFS(C2:C100,">=50",D2:D100,"Yes") counts rows that meet two conditions.','=VLOOKUP(A2,$G$2:$H$10,2,FALSE) fetches a price from a table; XLOOKUP does the same more flexibly.','=IFERROR(B2/C2,0) stops a divide-by-zero error from spoiling a report.','=PMT(rate/12,months,-loan) calculates a monthly loan repayment.','A pivot table summarises thousands of rows by category without writing a single formula.']],
['When a spreadsheet is the wrong tool',['Spreadsheets are superb for analysis and small data sets, but they are weak as the main store of an organisation’s records. They make it easy to duplicate data, there is no enforced primary key or referential integrity, and two people editing copies create conflicting versions. Performance and reliability fall as the data grows into hundreds of thousands of rows.','The usual pattern is to keep the data in a database and use the spreadsheet for modelling: query the database, export the results and analyse them in the spreadsheet.'],null,'Know when to recommend a database over a spreadsheet: many users, large volumes, linked data and a need for validation and audit trails.']],
k:[['What-if analysis','Changing an input to see how the output changes.'],['Goal seek','Working backwards from a target output to find the input value needed.'],['Pivot table','A summary table that groups and totals data by category.'],['Sensitivity analysis','Testing which input has the biggest effect on the result.']],e:'In a decision-support question, name the input you would change, the output you would watch and the function you would use.'},
'cape-it-data-communication-and-networks':{o:['Compare transmission media by speed, cost, range and interference','Identify network devices and state what each one does','Distinguish client–server from peer-to-peer networks and explain intranets, extranets and VPNs'],s:[
['Sending data',['Data travels as signals along a medium. Digital signals use discrete on/off values; analogue signals vary continuously, which is why a modem was once needed to convert between the two on telephone lines. Bandwidth is how much data a channel can carry per second, while latency is the delay before it starts to arrive — a satellite link can have high bandwidth and still feel slow because of its latency.','Direction matters too. Simplex sends one way only, like a radio broadcast. Half duplex lets both sides talk but not at the same time, like a walkie-talkie. Full duplex lets both talk simultaneously, like a phone call.'],['Serial transmission sends bits one after another down a single path; parallel sends several at once but suffers from timing problems over distance.','Error detection methods such as parity bits and checksums catch corrupted data in transit.']],
['Transmission media and devices',['Choosing a medium is a trade-off between speed, cost, range and resistance to interference. The devices on the network then decide how traffic is shared and directed.'],['UTP twisted pair: cheap and easy to install; limited to about 100 m per run; affected by interference.','Coaxial cable: better shielded than UTP; used for cable TV and broadband links.','Fibre optic: very high bandwidth, long distances and no electrical interference — but costlier to install.','Microwave and satellite: cover large or difficult areas; satellite adds noticeable latency.','Wi-Fi: flexible and cheap to deploy; weaker security and speed that drops with distance.','Hub: repeats data to every port. Switch: sends data only to the intended device. Router: connects different networks and chooses the path. Access point: adds wireless coverage to a wired LAN. Modem: connects to the ISP line.'],'“Hub versus switch” is a classic question: a switch learns which device is on which port, so it does not flood everyone with every message.'],
['Designing for an organisation',['In a client–server network, powerful central servers provide files, email, printing and authentication, and clients request those services. It is easier to secure, back up and manage centrally, at the cost of the server hardware and an administrator. In a peer-to-peer network every computer shares directly with the others — cheap and simple for a few users, but hard to secure or back up.','An intranet is a private network using web technology for internal staff only. An extranet extends selected access to partners or suppliers. A virtual private network (VPN) creates an encrypted tunnel across the public internet so remote workers can reach internal resources safely.']]],
k:[['Bandwidth','The maximum amount of data a channel can carry per second.'],['Latency','The delay between sending data and it starting to arrive.'],['Full duplex','Transmission in both directions at the same time.'],['VPN','A virtual private network: an encrypted tunnel across a public network.']],e:'When recommending a medium, justify it with the scenario: “fibre between the buildings because the run is 300 m and must be immune to electrical interference.”'},
'cape-it-it-security-and-society':{o:['Evaluate security controls using confidentiality, integrity and availability','Explain risk assessment and disaster recovery planning','Discuss the legal, ethical, social and environmental effects of IT'],s:[
['Confidentiality, integrity, availability',['Security goals are summed up as the CIA triad. Confidentiality means only authorised people can read the data. Integrity means data is accurate and has not been altered improperly. Availability means authorised users can reach systems and data when they need them. Every threat can be described by which of the three it attacks: ransomware attacks availability, a leaked customer list attacks confidentiality, and a fraudster editing a payment record attacks integrity.','A risk assessment identifies assets, the threats to them, how likely each threat is and how damaging it would be. Controls are then chosen in proportion to the risk — spending more to protect a payroll database than a canteen menu.'],['Technical controls: encryption, firewalls, access control lists, antivirus, audit logs.','Physical controls: locks, biometrics, CCTV, fire suppression, secure disposal of old drives.','Administrative controls: policies, staff training, background checks, separation of duties.','Authentication (who are you?) comes before authorisation (what may you do?).']],
['Planning for the worst',['A disaster recovery plan sets out how to restore systems after fire, flood, hurricane, power failure or attack. It defines what must be recovered first, who is responsible and how long the organisation can survive without each system. Backups are the foundation: full, incremental and differential schemes trade storage against restore time, and copies should be kept off-site.','A hot site is a fully equipped duplicate ready within minutes; a warm site has equipment but needs data loaded; a cold site is an empty space to set up in. The right choice depends on how costly downtime is. Regular testing matters — a plan that has never been rehearsed is only a guess.'],null,'For a Caribbean scenario, mention hurricanes and extended power outages — examiners reward context-aware recovery plans.'],
['Law, ethics and society',['Organisations must follow data protection law, computer misuse law and copyright law. Beyond legal duty lie ethical questions: should an employer monitor staff email, should an algorithm decide who gets a loan, who is responsible when software harms someone? A professional code of conduct gives guidance where the law is silent.','IT reshapes society in both directions. It creates new jobs and widens markets, but automation removes others. The digital divide separates those with affordable access and skills from those without. Telecommuting saves travel but blurs work and home. And discarded devices become e-waste containing toxic materials, so reuse, recycling and responsible disposal matter.'],['Positive effects: access to education and services, efficiency, new businesses.','Negative effects: job displacement, privacy loss, cyberbullying, screen-related health issues.','Green IT: energy-efficient hardware, virtualisation, cloud consolidation, recycling.']]],
k:[['Confidentiality','Ensuring data can be read only by authorised people.'],['Integrity','Ensuring data is accurate and has not been improperly changed.'],['Availability','Ensuring systems and data can be used when needed.'],['Digital divide','The gap between people who have access to IT and the skills to use it, and those who do not.'],['Disaster recovery plan','A documented plan for restoring systems and data after a serious incident.']],e:'Discuss questions need both sides: give a benefit, a drawback and a judgement that refers to the scenario.'},

'dm-u1-elements-and-principles-of-design':{o:['Name the elements of design and recognise each in a layout','Apply the principles of design to organise elements','Analyse a poster by naming an element or principle and its effect'],s:[
['The building blocks',['Elements are the raw materials of any visual. A designer combines them deliberately, and each carries its own feeling: sharp diagonal lines energise a layout, soft curves relax it, rough texture feels handmade while glossy texture feels polished.'],['Line: the path between two points — straight, curved, thick, thin, implied.','Shape: a flat area defined by an outline — geometric or organic.','Form: a shape with depth, real or implied through shading.','Colour: hue, saturation and brightness working together.','Texture: the surface quality, real or simulated.','Space: the area around and between things — positive space holds the subject, negative space gives it room to breathe.','Value: how light or dark something is, which creates contrast and depth.']],
['The principles',['Principles describe how the elements are arranged to create order and meaning. A layout can use the same elements and succeed or fail purely on how the principles are applied.'],['Balance: symmetrical (mirror-like and formal) or asymmetrical (unequal parts that still feel stable).','Contrast: difference in size, colour, value or shape that makes something stand out.','Emphasis and focal point: the first thing the eye lands on.','Hierarchy: ranking information so readers know what to read first, second and third.','Repetition and rhythm: repeating elements to create pattern and consistency.','Proximity: grouping related items close together so they read as one unit.','Alignment: lining items up so the layout feels organised.','Unity: everything feeling like it belongs together.'],'Every principle can be broken on purpose, but only a designer who knows the rule can break it convincingly.'],
['Analysing a design',['To analyse a piece, work in three steps: describe what you see, name the element or principle responsible, and explain the effect on the viewer. For a concert poster, you might say that a very large, bold date at the top creates a clear focal point through contrast in size, while generous negative space around the band name gives it importance.']]],
k:[['Element','A basic visual ingredient of design, such as line, shape, colour or texture.'],['Principle','A guideline for arranging elements, such as balance, contrast or hierarchy.'],['Focal point','The part of a design that draws the eye first.'],['Negative space','The empty area around and between the main elements.'],['Hierarchy','Ordering information visually so the reader knows what to read first.']],e:'Never just list an element. Use the pattern “element, where it appears, effect on the viewer”.'},
'dm-u1-colour-theory':{o:['Use the colour wheel to build harmonious palettes','Explain additive (RGB) and subtractive (CMYK) colour and when each is used','Check colour contrast for accessibility'],s:[
['The colour wheel',['The wheel arranges hues in a circle. Primary colours cannot be made by mixing others; secondary colours come from mixing two primaries; tertiary colours sit between. Three properties describe any colour: hue is its position on the wheel, saturation is how pure or dull it is, and brightness (or value) is how light or dark it is.','Warm colours — reds, oranges, yellows — feel energetic and appear to advance. Cool colours — blues, greens, purples — feel calm and appear to recede. Designers use this to create depth and mood.'],['Complementary: opposite on the wheel; high contrast and vibrant when side by side.','Analogous: neighbours on the wheel; calm and cohesive.','Triadic: three colours evenly spaced; lively and balanced.','Split-complementary: one colour plus the two neighbours of its complement; contrast with less tension.','Monochromatic: one hue in different tints and shades; elegant and safe.']],
['RGB and CMYK',['Screens make colour by adding light. Red, green and blue light combined at full strength make white, which is why RGB is called additive. Each channel runs from 0 to 255, so rgb(255, 0, 0) is pure red and a hex code such as #FF0000 writes the same three values in hexadecimal.','Print makes colour by absorbing light with ink. Cyan, magenta, yellow and black (K for “key”) layered on white paper remove brightness, so CMYK is subtractive. Some bright screen colours cannot be printed — they fall outside the CMYK gamut — so designers working for print should choose CMYK early and proof on paper.'],['Web and screen work: RGB or hex.','Printing: CMYK.','Mixing all RGB light gives white; mixing all CMY ink gives a muddy dark brown, which is why black ink is added.']],
['Colour that works for everyone',['Colour carries meaning, but meaning changes with culture — white is associated with weddings in some places and mourning in others. It also has to be readable. Contrast ratio compares the lightness of text and its background on a scale from 1:1 to 21:1. The accessibility guidelines (WCAG) ask for at least 4.5:1 for normal text and 3:1 for large text at the AA level.','Roughly one in twelve men has some form of colour-vision deficiency, so never use colour as the only signal. A red error message should also have an icon or text label; a chart should use patterns or labels as well as colours.'],null,'Use the Colour mixer in the Demos section to see the contrast ratio of any colour you make.']],
k:[['Hue','The position of a colour on the colour wheel, such as red or blue.'],['Saturation','How pure or intense a colour is, from grey to vivid.'],['Additive colour','Colour made by combining light, as on screens (RGB).'],['Gamut','The range of colours a device or process can reproduce.'],['Contrast ratio','A measure of the lightness difference between text and its background.']],e:'For “choose a colour scheme”, name the harmony, give the colours and justify them with the audience and purpose of the design.'},
'dm-u1-typography':{o:['Label the parts of a letterform','Classify typefaces and choose them for a purpose','Set body text so it is comfortable to read'],s:[
['Anatomy of type',['Typography is the craft of arranging type so that it is both readable and expressive. A typeface is the design (such as Garamond); a font is one specific weight and size of it (Garamond Bold 12 pt). Designers use a shared vocabulary to talk about letters.'],['Baseline: the invisible line letters sit on.','x-height: the height of lower-case letters like x — a large x-height reads well at small sizes.','Ascender and descender: strokes that rise above (b, d) or drop below (p, g) the x-height.','Cap height: the height of capital letters.','Counter: the enclosed or partly enclosed space inside letters such as o and e.','Serif: the small finishing strokes on the ends of letters.']],
['Classifying typefaces',['Serif typefaces have finishing strokes and often feel traditional and authoritative; they have long been used for printed books. Sans serif typefaces drop them for a clean, modern look that works well on screens. Script typefaces imitate handwriting and suit invitations, but are hard to read in long passages. Display typefaces are made for large headlines only, and monospace typefaces give every character the same width, as in code.'],['Never set a paragraph in all capitals — it is slow to read.','Limit a layout to two typefaces, one for headings and one for body text.','Pair by contrast: a bold sans heading with a serif body, rather than two similar faces.']],
['Setting type',['Readable text comes from a handful of adjustments. Point size sets the height of type. Leading is the vertical space between lines, usually 120–150% of the point size. Tracking adjusts spacing across a whole word or line; kerning adjusts the gap between a specific pair of letters, like “AV”. The measure — the line length — should be about 45 to 75 characters for comfortable reading.','Alignment shapes the look: left-aligned text is easiest to read, centred text suits short headings, and justified text can leave awkward gaps unless hyphenation is used. Hierarchy comes from size, weight and colour — a reader should know at a glance what is a headline, a subheading and body copy.'],null,'When asked to improve a layout, mention at least three type settings: size, leading and measure.']],
k:[['Typeface','A family of letterforms sharing one design, such as Garamond or Helvetica.'],['Leading','The vertical space between lines of text.'],['Kerning','Adjusting the space between two specific letters.'],['Tracking','Adjusting the spacing across a group of letters.'],['Measure','The length of a line of text, ideally 45–75 characters.']],e:'Back up every typography choice with a reason linked to readability or the audience, not just personal taste.'},
'dm-u1-digital-images-and-resolution':{o:['Distinguish bitmap from vector graphics and give a use for each','Explain pixel dimensions, resolution and colour depth and calculate file size','Choose an appropriate file format for a given job'],s:[
['Bitmap or vector',['A bitmap (raster) image is a grid of pixels, each storing a colour. Photographs are bitmaps because they contain millions of subtle colour changes. The weakness is that a bitmap has a fixed number of pixels: enlarge one too far and it turns blocky or blurry, because the software can only guess the missing detail.','A vector graphic stores mathematical descriptions of shapes — points, lines, curves and fills. Because it is a set of instructions rather than pixels, it can be scaled to any size, from a phone icon to a billboard, with perfect sharpness. Vectors suit logos, icons and illustrations, but cannot capture photographic detail.']],
['Resolution and file size',['Pixel dimensions are the width and height in pixels. Resolution, measured in pixels per inch (PPI) or printer dots per inch (DPI), says how densely they are packed when displayed or printed. Screens are typically designed at around 72–96 ppi; professional print generally needs 300 dpi.','Colour depth is the number of bits stored per pixel: 1 bit for black and white, 8 bits for 256 colours, 24 bits for “true colour”. An uncompressed file size in bytes is width × height × colour depth ÷ 8.'],['Example: 1000 × 800 pixels at 24 bits = 19,200,000 bits = 2,400,000 bytes ≈ 2.29 MB.','Printing that image at 300 dpi gives a print size of only about 3.3 × 2.7 inches.','Doubling both dimensions quadruples the number of pixels and the file size.','Resampling up never adds real detail — shoot or source at the size you need.'],'Use the Image size calculator in the Demos section to test the formula yourself.'],
['Choosing a format',['The right format depends on content and destination. JPEG uses lossy compression and is ideal for photographs, but repeated saving degrades it. PNG is lossless, supports transparency and suits screenshots, logos and graphics with flat colour. GIF is limited to 256 colours but supports simple animation. SVG is the standard vector format for the web. TIFF is a high-quality lossless format for print and archiving, and WebP is a modern web format that is smaller than both JPEG and PNG at similar quality.'],['Photo for a website: JPEG or WebP.','Logo with transparent background: PNG or SVG.','Print-ready artwork: TIFF or high-quality PDF.','Simple looping animation: GIF.']]],
k:[['Pixel','The smallest single point of colour in a bitmap image.'],['Vector graphic','An image described by mathematical shapes, so it scales without losing quality.'],['DPI','Dots per inch: how densely a printer places ink dots.'],['Colour depth','The number of bits used to store the colour of each pixel.'],['Lossy compression','Reducing file size by permanently discarding some data.']],e:'Show your working for file-size calculations: dimensions, times bits, divide by 8, then convert units.'},
'dm-u1-layout-and-composition':{o:['Construct a grid with columns, margins and gutters','Use composition guides such as the rule of thirds and visual hierarchy','Turn a client brief into a layout through thumbnails, roughs and a final comp'],s:[
['Grids',['A grid is an invisible framework that divides a page into columns and rows. It does the thinking about alignment for you: when every element snaps to the same structure, the layout looks ordered and designers work faster. Margins frame the content, gutters separate the columns, and the same grid carried across every page of a booklet makes the whole thing feel like one publication.','A common magazine layout uses 12 columns because 12 divides into halves, thirds and quarters, giving freedom with structure. Designers deliberately break the grid for emphasis — an image that bleeds off the edge of the page works precisely because the other elements obey the grid.'],['Margins: the empty border around the page.','Columns: vertical divisions that hold text and images.','Gutter: the space between columns.','Bleed: artwork extended beyond the trim edge so no white edge shows after cutting (typically 3 mm).']],
['Composition',['Composition is the arrangement of everything inside the frame. The rule of thirds divides the frame into a three-by-three grid; placing the focal point on a line intersection feels more dynamic than dead centre. Readers scan in predictable paths — often an F-pattern on text-heavy pages and a Z-pattern on simple ones — so important information should sit along that path.','White space (negative space) is not wasted space. Crowded layouts feel cheap and tiring; generous space signals quality and directs attention. Proximity groups related items, and consistent alignment ties them together.']],
['From brief to layout',['A brief states the audience, purpose, format, content and constraints (budget, deadline, printing method). Good designers interrogate it before opening any software, then work from small to large: quick thumbnail sketches to explore ideas, a rough layout of the best one, a full-colour comp for client approval, and finally production-ready artwork.','Check the work against the brief at every stage. Would the intended reader understand the message in three seconds? Is it legible at the size and in the conditions where it will actually be used?'],null,'In exam answers, refer to the brief: justify each layout decision by the audience or purpose it serves.']],
k:[['Grid','An invisible framework of columns and rows that organises a layout.'],['Gutter','The space between columns.'],['Bleed','Artwork extended past the trim edge so no white border shows after cutting.'],['Visual hierarchy','The arrangement of elements to show their order of importance.'],['Rule of thirds','A guide that divides a frame into nine parts and places key elements on the intersections.']],e:'Always tie layout decisions back to the brief. “The 12-column grid suits a 24-page guide because…” beats “it looks neat”.'},
'dm-u1-media-ethics-and-copyright':{o:['Explain how copyright arises and what it protects','Compare licences and know when permission is needed','Discuss ethical issues in representing and editing people and events'],s:[
['Copyright basics',['Copyright is the legal right of a creator to control how their original work is copied, adapted and shared. It arises automatically when the work is created and fixed — a photograph, a logo, a song, a video or a block of text — with no registration or © symbol required. It typically lasts for the author’s life plus 50 to 70 years, depending on the country.','The fact that something is on the internet does not make it free to use. Copying it without permission, even for a school project that will be published, can infringe the owner’s rights. Limited exceptions, often called fair use or fair dealing, may permit using small portions for criticism, review or education, but they are narrow and depend on the law of your country.'],['The creator is usually the first owner — unless the work was made as an employee or the rights were assigned in a contract.','Moral rights include being credited as the author and objecting to distortion of the work.','Plagiarism is presenting someone else’s work as your own — an ethical breach even where no law is broken.']],
['Licences and permission',['A licence is permission, with conditions, to use a work. Reading the terms matters, because “free to download” does not mean “free to use commercially”.'],['All rights reserved: you must ask for permission and may have to pay.','Royalty-free: pay once, use many times within the licence terms — not the same as free.','Creative Commons: free use with conditions such as attribution (BY), non-commercial (NC) or no changes (ND).','Public domain: copyright has expired or been waived; anyone may use it.','Model and property releases: signed consent to use a person’s likeness or private property in your media.'],'Keep a record of where every asset came from and its licence. If you are ever challenged, that file is your defence.'],
['Ethics in media production',['Ethical practice goes beyond the law. Get informed consent before filming or photographing people, and take extra care with children. Do not edit images or audio in ways that mislead the audience, such as altering a photograph to change the meaning of an event. Retouching bodies and faces raises questions about the unrealistic standards it promotes, and AI-generated or manipulated media should be labelled so audiences are not deceived.','Represent communities accurately and avoid stereotypes. Design inclusively, with captions and alt text, so people with disabilities can access the work. Credit your collaborators and sources.']]],
k:[['Copyright','The legal right of a creator to control the copying and use of their original work.'],['Licence','Permission, with conditions, to use someone else’s work.'],['Attribution','Crediting the creator of a work you use.'],['Public domain','Works whose copyright has expired or been waived, free for anyone to use.'],['Plagiarism','Presenting someone else’s work as your own.']],e:'Distinguish clearly: copyright is the right, a licence is the permission, and plagiarism is the ethical failure of passing work off as your own.'},

'dm-u2-video-production':{o:['Describe the three phases of video production and what each produces','Plan shots using a script, storyboard and shot list','Apply basic editing and export decisions'],s:[
['Pre-production',['Most of a video’s quality is decided before the camera rolls. Pre-production starts with the idea, audience and purpose, then moves to a script, a storyboard (drawn frames showing each shot), a shot list (every shot with its type, angle and location), a schedule, a budget and a checklist of equipment. Locations need permission, and people who appear on camera should sign a release.','Scout locations at the same time of day you plan to shoot, to check light, noise and power.'],['Script: dialogue and narration.','Storyboard: visual plan, one frame per shot.','Call sheet: who must be where, and when.','Risk check: weather, safety and a backup plan.']],
['Production',['On set, shots are chosen to tell the story. Wide or establishing shots show where we are, medium shots show action and close-ups show emotion. Angles change meaning: a low angle makes a subject look powerful, a high angle makes them look small. Keep the camera steady, frame with the rule of thirds and leave headroom.','The 180-degree rule keeps the camera on one side of an imaginary line between two subjects so left and right stay consistent. Lighting follows the three-point setup — key, fill and back light — and clear sound matters as much as the image, because viewers forgive poor pictures far sooner than poor audio.'],['Extreme close-up: a small detail such as the eyes.','Close-up: the face fills the frame.','Medium shot: a person from the waist up.','Wide shot: the whole subject in its surroundings.','B-roll: supporting footage used to cover cuts and add context.']],
['Post-production',['In editing, footage is logged and organised, assembled into a rough cut, tightened into a fine cut, then colour corrected and sound-mixed. The cut is the most common transition; dissolves and fades suggest the passing of time and are best used sparingly. Pacing — how long each shot stays on screen — controls the energy of the whole piece.','Finally the project is exported using a codec, which compresses the video. H.264 in an MP4 container is the most widely compatible choice. Export settings must match the destination: 1920 × 1080 (16:9) for most screens, 1080 × 1920 (9:16) for vertical mobile video, and a frame rate that matches how it was shot — commonly 24, 25 or 30 frames per second.'],null,'Always say what each phase produces: pre-production produces the plan, production the footage, post-production the finished video.']],
k:[['Storyboard','A sequence of drawn frames planning each shot of a video.'],['B-roll','Supporting footage that covers cuts and adds context to the main action.'],['Codec','Software that compresses and decompresses video or audio, such as H.264.'],['Frame rate','The number of frames shown per second, such as 24 or 30.'],['Shot list','A list of every shot needed, with type, angle and location.']],e:'Link every choice to the audience and destination: “vertical 9:16 export because the audience watches on phones”.'},
'dm-u2-animation-fundamentals':{o:['Explain frames, frame rate and keyframes','Describe tweening and easing and when to use each','Apply principles of animation to a simple action'],s:[
['Frames and motion',['Animation creates the illusion of movement by showing a sequence of still images quickly enough that the brain blends them together. Film typically runs at 24 frames per second; animators sometimes draw “on twos”, a new drawing every second frame, so 12 drawings cover a second of film and the movement still looks smooth.','Techniques include traditional hand-drawn (cel) animation, stop motion (photographing objects moved a little between frames), 2D digital cut-out animation, 3D computer animation and motion graphics for text and shapes.']],
['Keyframes and easing',['In digital animation you rarely draw every frame. A keyframe records a value — position, size, rotation or opacity — at a specific time. The software fills in the frames between keyframes, a process called tweening (in-betweening). Animating a ball across the screen needs only two keyframes, start and end.','Without easing, tweened motion is linear and robotic. Ease-in starts slowly and speeds up, ease-out slows down toward the end, and ease-in-out does both. Most real objects accelerate and decelerate, so easing makes movement feel natural.'],['Linear: constant speed; good for machinery and loading bars.','Ease-out: quick start, soft stop; good for things arriving on screen.','Ease-in: slow start, fast exit; good for things leaving the screen.','Timeline layers and graph editors give fine control over each property.']],
['The principles in practice',['Disney animators codified twelve principles that make motion believable. You do not need all twelve for every shot, but you should be able to describe how a few of them shape an action.'],['Squash and stretch: a ball flattens on impact and stretches at speed, giving weight and flexibility.','Anticipation: a small opposite movement before the main action, like crouching before a jump.','Follow-through and overlapping action: loose parts such as hair or a tail keep moving after the body stops.','Slow in and slow out: more frames near the start and end of a movement.','Arcs: natural movement follows curved paths rather than straight lines.','Timing: the number of frames decides speed and mood; fewer frames means faster.','Exaggeration, staging, secondary action, straight-ahead and pose-to-pose, solid drawing and appeal complete the twelve.'],'In an exam, describe a concrete moment: “a bouncing ball squashes on impact, which shows its weight”, not just the name of the principle.']],
k:[['Keyframe','A frame that defines the start or end of a change, such as a position at a given time.'],['Tweening','Automatically generating the frames between two keyframes.'],['Easing','Varying the speed of a movement so it accelerates or slows naturally.'],['Frame rate','The number of frames displayed per second.'],['Stop motion','Animation made by photographing objects moved slightly between frames.']],e:'Name the principle, give the moment where it appears and say what it makes the audience feel.'},
'dm-u2-audio-production':{o:['Describe how sound is digitised using sample rate and bit depth','Choose microphones and record clean audio','Edit and mix dialogue, music and effects'],s:[
['Sound as data',['Sound is a pressure wave. To store it digitally, the amplitude of the wave is measured thousands of times each second. The number of measurements per second is the sample rate: 44.1 kHz is used for music CDs and 48 kHz is the standard for video. Each measurement is stored with a certain bit depth — 16 bits is CD quality, 24 bits gives more headroom for editing.','More samples, more bits and more channels mean better fidelity and bigger files. Uncompressed audio size = sample rate × bit depth × channels × seconds ÷ 8.'],['One minute of stereo CD-quality audio: 44,100 × 16 × 2 × 60 = 84,672,000 bits.','Divide by 8 for bytes: 10,584,000 bytes, about 10.1 MB.','WAV and AIFF are uncompressed; FLAC is lossless compressed; MP3 and AAC are lossy compressed.']],
['Capturing good sound',['Clean recording is easier than repairing bad recording. Dynamic microphones are rugged and reject background noise, making them good for live and noisy places; condenser microphones are more sensitive and capture detail in a quiet studio. A cardioid pickup pattern hears mostly what is in front of it.','Place the microphone close to the source, use a pop filter for voice, and set the input level so peaks stay below the maximum. If the level is too high the waveform flattens at the top — clipping — and the distortion cannot be removed. Record a few seconds of “room tone” in each location for use in the edit.']],
['Editing and mixing',['Editing removes mistakes, tightens pauses and adds fades so cuts are not audible. A mix balances several tracks — dialogue first, then music and sound effects beneath it. Equalisation (EQ) shapes the tone by boosting or cutting frequencies, compression reduces the gap between quiet and loud so speech stays clear, and noise reduction removes steady hiss.','Sound design adds meaning. Foley artists recreate everyday sounds such as footsteps in a studio, ambient sound sets the place, and music sets the mood. Always check the mix on both headphones and small speakers, and export in the format required by the destination.'],null,'Remember the order of importance: clear dialogue first, then effects and music that support it.']],
k:[['Sample rate','The number of times per second a sound wave is measured when digitised.'],['Bit depth','The number of bits used to store each audio sample.'],['Clipping','Distortion caused by a recording level that is too high.'],['Equalisation (EQ)','Boosting or cutting particular frequencies to shape the tone of a sound.'],['Foley','Sound effects recreated in a studio and synchronised to the picture.']],e:'For file-size questions, write the formula first, then substitute: rate × depth × channels × seconds ÷ 8.'},
'dm-u2-web-design-and-html':{o:['Build a page structure using semantic HTML5 elements','Style elements with CSS selectors, the box model and flexbox','Explain responsive design and accessibility requirements'],s:[
['Structure with HTML',['HTML (HyperText Markup Language) describes the content and structure of a page using tags. Every page has the same skeleton: a doctype, an &lt;html&gt; element, a &lt;head&gt; for information about the page and a &lt;body&gt; for what the visitor sees.','Semantic elements say what the content is, not just how it looks. They help screen readers, search engines and other developers understand the page.'],['&lt;header&gt;, &lt;nav&gt;, &lt;main&gt;, &lt;article&gt;, &lt;section&gt;, &lt;footer&gt;: the regions of a page.','&lt;h1&gt; to &lt;h6&gt;: headings in a logical order, with one &lt;h1&gt; per page.','&lt;p&gt;, &lt;ul&gt;, &lt;ol&gt;, &lt;li&gt;: paragraphs and lists.','&lt;a href="contact.html"&gt;Contact&lt;/a&gt;: a link to another page.','&lt;img src="crest.png" alt="School crest"&gt;: an image with alternative text.']],
['Presentation with CSS',['CSS (Cascading Style Sheets) controls how HTML looks. A rule has a selector, which says what to style, and declarations, which say how: p { color: #1a1a1a; line-height: 1.6; }. Rules can target an element (p), a class (.card) or an ID (#logo). Keeping CSS in a separate file means one change restyles every page.','Every element is a box made of content, padding, border and margin, from the inside out. Understanding the box model explains almost every spacing problem. Flexbox arranges items in a row or column and distributes space between them, which makes navigation bars and card layouts straightforward.'],['color and background-color set text and fill.','font-family, font-size and line-height control typography.','margin pushes elements apart; padding gives content breathing room.','display: flex; gap: 1rem; lines up children with space between them.']],
['Responsive, accessible and interactive',['A responsive site adapts to any screen size. The viewport meta tag tells phones to use the device width, flexible units such as percentages and rem avoid fixed sizes, and media queries apply different CSS at different widths. Designing mobile-first — starting with the small screen and adding complexity for larger ones — forces you to prioritise content.','Accessibility means everyone can use the site. Write alt text for meaningful images, keep text contrast high, make every function work from the keyboard, use real headings and label every form field. JavaScript then adds behaviour, such as menus and form checks. Keeping structure, presentation and behaviour separate makes a site easier to maintain.'],null,'In exam answers, say why a semantic tag is better than a generic one: it gives meaning to screen readers and search engines.']],
k:[['HTML','The markup language that defines the structure and content of a web page.'],['CSS','The language that controls the presentation of HTML elements.'],['Box model','The model describing every element as content, padding, border and margin.'],['Responsive design','Design that adapts the layout to the size of the screen.'],['Alt text','A text description of an image for screen readers and when the image fails to load.']],e:'If asked for code, write it neatly indented and comment it. Marks are given for correct structure first, then for correct syntax.'},
'dm-u2-interactive-media-and-ux':{o:['Explain user-centred design and the role of personas','Produce wireframes and prototypes at different fidelity','Apply core usability principles and plan a usability test'],s:[
['Design for real people',['User experience (UX) is how a person feels when using a product, and user-centred design keeps real users at the centre of every decision. You start by researching who they are and what they need — interviews, surveys, observation — and summarise the findings in personas: fictional but realistic users with goals, frustrations and context. A user journey then maps the steps a persona takes to reach a goal, exposing where the experience breaks down.'],['User story: “As a parent, I want to see the school calendar so I can plan pickups.”','Information architecture: how content is grouped and labelled.','Navigation: clear labels, a consistent position and few levels deep.']],
['From sketch to prototype',['Ideas become more concrete in stages. A wireframe is a low-fidelity, black-and-white layout showing structure and content placement without colour or imagery, quick to draw and easy to throw away. A mockup adds visual design, and a prototype adds interaction so testers can tap through a flow. Starting low-fidelity keeps the conversation on structure instead of colours, and mistakes are cheap to fix.'],['Low-fidelity: paper sketches, boxes and labels.','High-fidelity: realistic visuals and clickable behaviour.','Flowchart or sitemap: shows how pages or screens connect.']],
['Usability and testing',['Good interaction design follows well-known heuristics. The system should show what is happening (feedback), match the real world in its language, be consistent, prevent errors before they occur, favour recognition over recall, and offer clear exits. Affordances and signifiers tell people what they can do — a button that looks pressable invites a press. Targets must be large enough to tap, especially on touch screens.','Usability testing puts the prototype in front of real users who attempt realistic tasks while you observe without helping. Even about five participants will reveal most of the major problems. Measure success rate, time on task and errors, then revise and test again — design is iterative.'],null,'When asked to evaluate an interface, name the principle, show the problem and propose a fix.']],
k:[['Persona','A fictional but realistic user profile based on research.'],['Wireframe','A low-fidelity layout showing structure and content placement.'],['Affordance','A property of an object that suggests how it can be used.'],['Usability testing','Watching real users attempt tasks to find problems in a design.'],['Prototype','An interactive model of a product used to test ideas before building.']],e:'Use the pattern “principle, problem, fix”. For example: “feedback, the button gives no response when tapped, add a loading state”.'},
'dm-u2-project-management-and-portfolio':{o:['Define scope and break a project into tasks with milestones','Plan with a Gantt chart, manage risks and version files','Curate a portfolio that shows process as well as results'],s:[
['Planning the project',['A project is a temporary effort with a goal, a deadline and limited resources. It starts with a clear scope: what will be delivered, for whom and what is not included. Write objectives that are SMART — specific, measurable, achievable, relevant and time-bound — then break the work into tasks using a work breakdown structure.','Each task gets an owner, an estimate and dependencies, because some tasks cannot start until others finish. A Gantt chart plots tasks against a calendar so you can see the critical path — the chain of tasks that determines the earliest finish date. Milestones mark checkpoints, such as client approval of the storyboard.'],['Triple constraint: scope, time and cost — change one and the others are affected.','Risk register: list what could go wrong, how likely it is and how you would respond.','Communicate: regular check-ins and written sign-offs with the client avoid costly misunderstandings.']],
['Managing files and versions',['Digital media projects create huge numbers of files. A clear folder structure and a consistent naming convention (for example 2026-11_FarmMarket_Promo_v03.mp4) save hours. Never overwrite the only copy of a file: save new versions, or use version control or cloud history so you can go back.','Follow the 3-2-1 backup rule: three copies, on two different types of storage, with one off-site. Keep source files (layered, editable) separate from exports, and store assets with their licence information.']],
['Building a portfolio',['A portfolio is evidence of what you can do. Choose six to ten of your best pieces rather than everything you have made, and make sure they show range without losing a consistent standard. For each, tell a short story: the brief, your role, the tools you used, your process and the result. Sketches, drafts and before-and-after comparisons show how you think, which employers value as much as the polished outcome.','Present it where your audience will find it — a simple website, a PDF and a social profile — with clear contact details and easy navigation. Get feedback, update it regularly and always secure permission before showing client work.'],null,'A portfolio is itself a design project: apply the same layout, typography and UX principles you have learned to your own presentation.']],
k:[['Scope','The agreed boundaries of a project: what will and will not be delivered.'],['Milestone','A checkpoint marking the completion of an important stage.'],['Gantt chart','A bar chart showing tasks, their durations and dependencies against time.'],['Version control','Tracking changes to files so earlier versions can be restored.'],['Critical path','The longest chain of dependent tasks, which sets the minimum project length.']],e:'In a planning question, include scope, a task list with dependencies, a schedule with milestones and at least one risk with a response.'}
});

{sc:['It is the Monday of exam week at a secondary school in a rural parish. The school’s 60 computers — 20 in each of two labs and 20 in the business-education room — all connect to a single core switch in the staff-room cupboard, in a star topology. Students are due to finish and print their IT School-Based Assessments (SBAs) this week, and the online candidate-registration portal closes on Friday.','At 7:40 a.m. the switch fails after a power surge. Every lab loses network access, shared folders and the internet at once. The school has no spare switch. The IT teacher is part-time and only comes in on Tuesdays and Thursdays, and nobody has a current diagram showing which cable goes where.','The principal asks you, as the temporary IT consultant, to explain what happened, get students working again and make sure a single failure never causes this much damage again.'],
f:['60 computers in a star topology, all connected to one core switch.','No spare equipment, no UPS (only a basic surge protector) and no network diagram.','Student SBA files are saved on a shared drive on a server in the staff room. The last backup was copied to a USB stick three weeks ago.','Deadline: SBA submissions and online registration both close on Friday.','Budget is limited, but the PTA can approve small purchases quickly.'],
q:[
['Explain why the star topology made this failure so damaging, and what would have happened if the cable to a single computer had failed instead.',ul(['In a star topology every device’s only path to the others runs through the central switch. When it failed, all 60 computers lost the network at the same time: it is a single point of failure.','A failed cable to one computer would have cut off only that machine. The other 59 would carry on, and the fault would be easy to trace because each cable runs to exactly one device.','The strength of the star (easy fault isolation) became its weakness, because the central device had no backup.'])],
['List the actions you would take in the first 24 hours, in priority order.',ul(['Confirm the cause: check the power and indicator lights on the switch and test with a known-good cable.','Protect the data: check that the server still holds the SBA files and make an immediate copy before reconnecting anything.','Restore connectivity: borrow or buy a replacement switch (the PTA can approve small purchases quickly), or temporarily link one lab with a small unmanaged switch so the candidates can work first.','Keep students productive: let them continue their SBAs offline and save to USB sticks until the network returns.','Protect the Friday deadline: make sure at least one machine has internet access for the registration portal, even if that means a mobile hotspot.','Communicate: tell staff and students what is happening and when the next update will come.'])],
['Recommend three longer-term changes and say which risk each one reduces.',ul(['Keep a spare or standby switch: reduces the single-point-of-failure risk.','Fit a UPS and surge protection on the core switch and server: reduces the risk of power damage.','Automate backups to a second location, off-site or in the cloud, and test restores: reduces the risk of data loss.','Draw and label a network diagram and cable map: reduces recovery time when the part-time technician is absent.','Arrange a maintenance routine and train a second staff member: reduces dependence on one person.'])],
