{sc:['Sweet Rise is a family bakery with two shops and a delivery van. The owner keeps all her business records in one spreadsheet on the shop-counter computer: 4,000 customer records with names, phone numbers, addresses and standing orders for weddings and events, plus prices and supplier details.','The computer has a single login that every employee uses. The password is the shop’s name and the year it opened. Last month a part-time driver was let go. On Monday the owner opens the file and finds that most of the rows have been deleted or overwritten. Customers are calling to ask why their orders were not delivered.','The only backup is a USB stick that the owner last updated seven months ago. She is not sure whether the file was tampered with or whether someone accidentally broke it.'],
f:['4,000 customer records stored in one spreadsheet on one computer.','One shared password known to every current and former employee.','No access levels: anyone who can open the file can edit or delete anything.','Backup: one USB stick, seven months old, kept in a drawer beside the computer.','The customer data includes names, phone numbers and home addresses.'],
q:[
['Which parts of the CIA triad were compromised? Justify each.',ul(['Availability: the owner and staff can no longer use the customer list to fulfil orders.','Integrity: records have been deleted or overwritten, so the data can no longer be trusted. Even the surviving rows may have been altered.','Confidentiality: possibly compromised too, because a former employee may still know the password and could have copied the list. There is no log to prove either way.'])],
['Identify four vulnerabilities in the bakery’s set-up.',ul(['A shared, guessable password that was never changed when a staff member left.','No individual accounts, so no accountability and no audit trail showing who made changes.','No access control or least privilege: every user has full edit rights.','A single, old, unprotected backup, and no backup routine.','Using a flat spreadsheet as the master record, which has no integrity rules or change history.','A single computer, with no protection against theft, fire or hardware failure.'])],
['Recommend a recovery and prevention plan.','<p>Immediate steps:</p>'+ul(['Change every password and stop using the shared login.','Restore the seven-month-old backup to a new file, then rebuild recent changes from delivery notes, phone records and emails.','Contact the most important customers directly to rescue standing orders.'])+'<p class="mt-3">Prevention:</p>'+ul(['Give each person their own account with only the access their job needs, and remove access on the day someone leaves.','Automate backups (3-2-1: three copies, two kinds of storage, one off-site) and test a restore.','Move the customer data into a proper database or cloud system with an audit log and validation.','Write a short security policy and train staff on it.'])],
['The file contains customers’ personal details. What responsibilities does the bakery have, and what should it do now?',ul(['Under data protection principles, an organisation must keep personal data secure and only use it for the purpose it was collected for. Losing control of it is a security failure.','Find out what happened: check whether the former employee accessed the file, and if the data may have been exposed, consider telling the affected customers and any regulator that requires notification.','Be honest with customers about delays and apologise. Trust is easier to keep than to rebuild.','In future, collect only what is needed, restrict access and decide how long data is kept.'])]
],
l:['cape-it-it-security-and-society','csec-it-data-security','cape-it-databases-and-data-modelling']},

{sc:['The Ministry of Education’s regional office built a small program to rank students by their exam marks. It was tested with a class list of 50 students and finished instantly, so it went into use. The sorting routine is a bubble sort that the developer wrote in an afternoon.','In June the office loads the results for 12,000 candidates. The program runs for several minutes, the progress bar freezes, and the officers start to worry that it has crashed. Nobody can explain why a program that worked perfectly in testing has suddenly become unusable.','You are asked to explain the problem and recommend a fix before results day.'],
f:['Algorithm: bubble sort on an array of exam marks.','Tested with 50 records; used with 12,000 records.','Bubble sort does work proportional to n² (of the order of n × n comparisons).','The records are held in memory and sorted by total mark.','Results must be sorted from highest to lowest, with ties kept in candidate-number order.'],
q:[
['Why did the program seem fine during testing?',ul(['With n = 50, a bubble sort needs of the order of 50² = 2,500 comparisons, which a computer does in a tiny fraction of a second.','The problem is not an error in the logic. It is that the amount of work grows much faster than the data.','The test data was too small to expose the inefficiency. Testing must include realistic volumes.'])],
['Estimate how much more work 12,000 records need than 50 records.','<p>The data grew by a factor of 12,000 ÷ 50 = 240. Because the work grows with n², the work grows by 240² = 57,600 times: from about 2,500 steps to about 144 million.</p><p class="mt-2">Even if each step takes only microseconds, the total adds up quickly, and a slow environment (an old machine, a spreadsheet macro) can stretch it to minutes. That is the difference between “instant” and “frozen”.</p>'],
['Recommend a better algorithm and state any trade-offs.',ul(['Use merge sort or quicksort, which take about n log n steps: roughly 12,000 × 13.6 ≈ 163,000 operations instead of about 144 million, which is around 900 times less work.','Trade-offs: merge sort needs extra memory for merging; quicksort can degrade to n² on badly ordered data unless the pivot is chosen well; both are harder to write than bubble sort.','Practical choice: use the language’s built-in sort, or the database’s ORDER BY, which are already optimised and well tested.','A stable sort (such as merge sort) keeps equal marks in their original candidate-number order, which meets the ties requirement.'])],
['What testing would have caught this before results day?',ul(['Performance testing with a realistic volume (12,000 records or more), and timing the result.','Testing the worst case (data in reverse order) as well as the typical case.','Stating an acceptable response time up front, so “fast enough” is measurable.'])]
],
l:['cape-cs-algorithms-and-complexity','cape-cs-data-structures']},

{sc:['A parish council wants to refresh its 24-page community tourism guide for visitors. The current booklet is printed in A5, handed out at hotels and also sent as a PDF that people read on their phones. Feedback is blunt: the text is hard to read, the pages look messy and some of the photographs are blurry.','Looking at the file, you find 8 pt light-grey body text over photographs, five different typefaces across 24 pages, images saved from websites at 72 dpi, and the council’s logo stretched to fit its box. The council is a not-for-profit with a small budget, and the booklet is often read outdoors in bright sun.','The council has asked you to rebrand the guide so it works in print and on screen, and to explain your decisions.'],
f:['Format: 24 pages, A5 (148 × 210 mm), print plus PDF.','Current body text: 8 pt, light grey, often over photographs.','Typefaces: five different families across the booklet.','Images: downloaded from websites at 72 dpi, many only about 900 px wide.','Audience: visitors reading in bright sunlight, on phones and on paper.','Budget is small, but volunteers can take new photographs.'],
q:[
['Diagnose the layout and typography problems using the elements and principles of design.',ul(['Hierarchy is missing: headings, subheadings and body text do not differ clearly, so the eye has no path through the page.','Low contrast between light-grey text and photo backgrounds is far below the 4.5:1 accessibility minimum and will be nearly unreadable in sunlight.','Five typefaces break unity and look unprofessional. Two would be enough.','8 pt is too small for comfortable reading on a printed A5 page and impossible on a phone without zooming.','There is no consistent grid, so margins, alignment and spacing vary from page to page.'])],
['A web photograph is 900 pixels wide. Can it fill the width of an A5 page in print?','<p>A5 is 148 mm wide, about 5.83 inches. At 300 dpi it needs 5.83 × 300 ≈ 1,750 pixels across. A 900-pixel image stretched to the full width gives only about 154 dpi. Alternatively, at 300 dpi it can only be printed about 3 inches wide.</p><p class="mt-2">Enlarging it in software cannot add detail, so it would look soft. The fix is to use higher-resolution originals, for example new photographs from volunteers shot at the camera’s full resolution.</p>'],
['Propose a colour palette and type system for the new guide.',ul(['Colour: a limited palette of three to five colours drawn from the parish (for example sea blue, a warm sand tone and one strong accent), with dark text on a light background.','Check every text and background pair for at least 4.5:1 contrast, and avoid placing text directly over busy photographs. Use a solid panel or darken the image.','Type: one serif for body text and one bold sans serif for headings, with a clear scale (for example 10–11 pt body, larger headings) and generous leading.','Use a 12-column grid with consistent margins, and keep the logo in proportion with clear space around it.','Export a CMYK PDF for print and an RGB, compressed PDF for phones.'])],
['The council used photographs found on websites. What should it do?',ul(['Assume the photographs are protected by copyright. Using them requires permission or an appropriate licence, even for a non-profit.','Replace them with original photographs taken by volunteers, with permission from anyone recognisable, or with properly licensed images (for example Creative Commons with the required credit).','Keep a record of each image’s source and licence, and credit photographers in the booklet.','Using local people and places also makes the guide more authentic.'])]
],
l:['dm-u1-elements-and-principles-of-design','dm-u1-typography','dm-u1-digital-images-and-resolution','dm-u1-media-ethics-and-copyright']},

{sc:['A farmers’ market organiser wants a 60-second promotional video to attract new customers. It will appear on the market’s website and YouTube channel (16:9), as a vertical Instagram Reel and Facebook story (9:16), and on a screen at the market entrance.','There is only one shoot day, because the vendors only come together on Saturdays, and the budget has no room for reshoots. The organiser has a camera that records 4K, a phone gimbal, a lapel microphone and two volunteers. She also wants a short voice-over from a well-known local farmer.','You must plan the whole project so that one day of filming produces all three versions.'],
f:['Length: 60 seconds, with three deliverables (16:9, 9:16 and a looping version for the entrance screen).','One shoot day, Saturday morning, with no possibility of a reshoot.','Equipment: one camera that records 4K, a gimbal, a lapel mic and two volunteers.','Many viewers watch on phones with the sound off.','Vendors and customers will appear on camera.'],
q:[
['Outline the pre-production documents you would prepare and why each matters.',ul(['A script and voice-over outline, so the message is clear in 60 seconds.','A storyboard and shot list, so no key shot is forgotten on the only shoot day.','A schedule that uses the best light (early morning) and a call sheet for the volunteers.','Permissions: release forms from vendors and recognisable customers, and a sign at the entrance saying that filming is taking place.','A backup plan for rain or equipment failure, such as a charged spare battery and extra memory cards.'])],
['How would you film once but deliver both 16:9 and 9:16?',ul(['Record in 4K so there is enough resolution to crop a vertical frame from the widescreen footage without losing sharpness.','Keep the main subject in the centre third and leave safe space at the top and bottom of each shot, so both crops work.','Film some key shots in vertical orientation as well, since they are quick to capture.','Keep titles and logos inside a safe area that survives both crops.'])],
['Plan the audio.',ul(['Record the farmer’s voice-over afterwards in a quiet room, using the lapel mic close to the mouth and keeping levels low enough to avoid clipping.','Capture ambient sound at the market (a “wild track”) and room tone for use in the edit.','Use licensed or royalty-free music, kept below the voice in the mix.','Add captions, since many viewers will watch without sound.'])],
['Describe the export settings and checks before delivery.',ul(['Export H.264 MP4 files: 1920 × 1080 for 16:9 and 1080 × 1920 for 9:16, at the project’s frame rate (for example 25 or 30 fps).','Make the entrance-screen version loop cleanly, with no fade to black at the end.','Check on a real phone, a laptop and the entrance screen for legibility and sound.','Keep the project files and raw footage backed up using the 3-2-1 rule.'])]
],
l:['dm-u2-video-production','dm-u2-audio-production','dm-u1-layout-and-composition']},

{sc:['A national scholarship board has replaced its paper-and-email applications with an online portal. Applications open at 9:00 a.m. on a Monday, and the board expects 3,000 applicants, most of them submitting in the first hour because the news has been shared widely on social media.','The portal runs on a single server. Each submission writes the applicant’s details and uploaded documents (transcripts and ID scans of several megabytes each) into one database table. The system was tested by the three staff who built it, who each submitted a few applications. There was no trial with real applicants, and the old email process was switched off on Sunday night.','By 9:15 the site is crawling. By 9:30 the database has locked up and students see error messages. Social media fills with complaints and the board’s single helpline is jammed.'],
f:['One web server and one database server, with all uploads stored inside the database.','Expected load: about 3,000 applicants in the first hour.','Testing: three staff members and a handful of test applications.','Changeover: direct. The old email process was shut down the night before.','Support: one helpline phone number.','The closing date for applications is three weeks away.'],
q:[
['Which stages or choices in the systems development lifecycle were weak, and what was the consequence of each?',ul(['Testing: only a handful of users were tested, so nobody discovered how the system behaved under load.','Implementation: direct changeover left no fallback when the new system failed.','Design: storing large files in the database and relying on a single server created a bottleneck.','Support and training: one phone line was never going to cope with a launch-day failure.'])],
['Explain the likely technical causes of the lock-up.',ul(['Hundreds of simultaneous writes to one table caused locking and contention: transactions waited for each other until the database stalled.','Large file uploads consumed bandwidth, memory and database storage on a single server.','There was no queueing or scaling, so demand beyond capacity produced time-outs and errors.','Validation and processing carried out at the moment of submission slowed every request.'])],
['Recommend how the board should relaunch.',ul(['Run load testing that simulates thousands of users before the relaunch, and fix the bottlenecks it finds.','Store uploaded documents in separate file storage and keep only a reference in the database. Add server capacity or a queue to absorb peaks.','Use a phased or pilot changeover: open the portal to one group first, or stagger access by surname or parish, and keep the email process running in parallel.','Communicate clearly with a status page and longer helpline or email support.','Plan a post-implementation review to confirm the problems are really solved.'])],
['Should the board return to the email process while it fixes the portal? Argue both sides and give your recommendation.','<p>For returning: applicants can still apply, the closing date is three weeks away, and the email process is slow but proven. Staying with a failing system damages trust further.</p><p class="mt-2">Against: it wastes the investment, means entering the data twice later and could lose the applications already submitted.</p><p class="mt-2">A reasoned recommendation: reopen the email route now as a parallel option to protect applicants, fix and load-test the portal, then relaunch in phases. Marks are earned for weighing costs, risks and the deadline.</p>']
],
l:['cape-it-systems-development-lifecycle','cape-it-databases-and-data-modelling']}
];

/* ===== EXTENSIONS: more lessons, quizzes, case studies and live demos ===== */
function AL(ci,mi,meta,data){C[ci].m[mi][1].push(meta);L[C[ci].id+'-'+meta[0]]=data}

/* ---- New lessons ---- */
AL(0,0,['operating-systems','Operating systems and file management',13,'What the operating system actually does, the interfaces it offers, and how files stay organised.'],{
o:['List the main functions of an operating system','Compare graphical, command-line and menu-driven interfaces','Explain file paths and housekeeping utilities'],
s:[['The manager of the machine',['The operating system sits between the user and the hardware. It allocates memory, shares processor time between running programs, talks to hardware through driver software, manages files and enforces user permissions.','That is why a school lab computer can stop a student from installing software: the operating system checks the permissions attached to the user’s account.'],['Memory management: allocates and reclaims RAM.','Process management: shares CPU time between programs.','Device management: uses driver software to talk to hardware.','File management: create, name, store and retrieve.','Security: accounts, passwords and permissions.']],
['Interfaces, files and utilities',['A graphical interface (GUI) uses windows, icons, menus and a pointer: easy to learn but heavier on resources. A command-line interface (CLI) takes typed commands: powerful and scriptable but unforgiving of typing mistakes. A menu-driven interface guides the user through numbered choices.','A file is a named collection of data and its extension shows the type. An absolute path starts at the root of the drive; a relative path starts from the current folder. Utility programs such as antivirus, backup and disk clean-up keep the system healthy.'],['Compression utilities shrink files for storage or sending.','File attributes include read-only, hidden and archive.'],'Defragmentation only helps mechanical hard disks. On an SSD it wastes write cycles and gives no benefit.']],
k:[['Operating system','System software that manages hardware, memory, files, devices and users.'],['GUI','Graphical interface of windows, icons, menus and a pointer.'],['CLI','Interface where the user types commands.'],['Utility program','System program such as antivirus or backup software.']],
e:'When asked for functions of an operating system, name the function and add one sentence on what it does. A bare list earns half marks.'});

AL(0,0,['algorithms-and-flowcharts','Problem solving: algorithms and flowcharts',14,'Turning a word problem into ordered steps, then drawing those steps as a flowchart you can dry run.'],{
o:['Write an algorithm in pseudocode','Use the correct flowchart symbols','Trace an algorithm with a trace table'],
s:[['What an algorithm is',['An algorithm is a finite, ordered set of unambiguous steps that solves a problem. Pseudocode writes it in structured English using IF, WHILE, FOR and OUTPUT, so the logic can be checked before any programming language gets in the way.'],['Sequence: steps in order.','Selection: IF … THEN … ELSE.','Iteration: WHILE or FOR loops.','Every loop must eventually stop.']],
['Flowcharts and dry runs',['Flowcharts use standard symbols: an oval for start and stop, a parallelogram for input and output, a rectangle for a process and a diamond for a decision.','A dry run executes the algorithm by hand with sample data, writing each variable into a trace table. It is the quickest way to catch a loop that runs once too often or a branch that never happens.'],['Oval: start or stop.','Parallelogram: input or output.','Rectangle: process.','Diamond: decision with two exits.'],'Choose test data deliberately: normal, boundary (such as 0 or 100) and erroneous (such as letters where a number is expected).']],
k:[['Algorithm','A finite, ordered set of unambiguous steps that solves a problem.'],['Pseudocode','Structured English used to describe an algorithm.'],['Trace table','A table recording variable values after each step.'],['Boundary data','Test values at the edge of the valid range.']],
e:'If a question gives you a flowchart, trace it before answering. Most marks come from following the arrows correctly.'});

AL(1,0,['searching-and-sorting','Searching and sorting algorithms',16,'Linear and binary search, the classic sorts, and how to choose between them.'],{
o:['Trace linear and binary search','Describe bubble, selection and insertion sort','Compare algorithms using time complexity'],
s:[['Searching',['Linear search checks each item in turn: O(n), works on unsorted data and needs no extra memory. Binary search halves a sorted list at every step: O(log n), about 10 comparisons for 1,000 items and about 20 for a million, but it demands sorted data.','Sorting first costs time, so binary search pays off when the same data is searched many times.'],['Binary search uses low, high and mid pointers.','Compare the target with the middle item, then discard half.']],
['The classic sorts',['Bubble sort compares neighbours and swaps them when out of order: O(n²). Selection sort finds the smallest remaining item and swaps it into place: at most n − 1 swaps. Insertion sort shifts each item left into position: excellent on small or nearly sorted lists.','Merge sort splits, sorts and merges: O(n log n) in every case but needs extra memory. Quick sort is O(n log n) on average and O(n²) in the worst case.'],['Bubble, selection, insertion: O(n²).','Merge sort and quick sort: O(n log n).','Stability: equal items keep their original order.'],'There is no best algorithm in the abstract. Ask how big the data is, how often it changes and how much memory you can spare.']],
k:[['Linear search','Checking each item in sequence: O(n).'],['Binary search','Halving a sorted list repeatedly: O(log n).'],['Bubble sort','Repeated adjacent swaps: O(n²).'],['Stability','Equal items keep their original relative order.']],
e:'Always state the precondition of binary search: the list must be sorted. Never claim it works on unsorted data.'});

AL(1,0,['recursion','Recursion and the call stack',14,'Subprograms that call themselves: base cases, the stack, and when recursion beats a loop.'],{
o:['Write recursive subprograms with a base case','Trace recursive calls on the call stack','Decide when recursion is better than iteration'],
s:[['Two parts of every recursion',['A recursive subprogram calls itself on a smaller version of the same problem. It needs a base case that returns without calling again, and a recursive case that moves closer to the base case.','Factorial: factorial(0) = 1 and factorial(n) = n × factorial(n − 1). Remove the base case and the calls never stop, filling the call stack until a stack overflow.'],['Base case: stops the recursion.','Recursive case: smaller input each time.','Two recursive calls per level can grow exponentially.']],
['The call stack',['Each call creates a stack frame holding its parameters, local variables and return address. factorial(4) pushes four frames before the first value comes back, then the frames unwind in reverse order.','Because the stack is finite, very deep recursion can fail where a loop would succeed. Recursion suits tree-shaped problems such as folders and binary search trees; a simple counting loop is clearer and cheaper.'],null,'In a trace question, write each call, its argument and the value it returns.']],
k:[['Recursion','A subprogram that calls itself on a smaller problem.'],['Base case','The condition that stops the recursion.'],['Call stack','Structure holding one frame per active call.'],['Stack overflow','Failure caused by too many nested calls.']],
e:'If a recursive function has no base case, the expected answer is infinite recursion leading to stack overflow. Say both.'});

AL(2,0,['e-business-and-digital-services','E-business and digital services',14,'How organisations trade and serve customers online, and what that demands of their systems.'],{
o:['Distinguish e-business from e-commerce','Identify B2B, B2C and C2C models','Explain the trust and security needs of online payment'],
s:[['Beyond buying and selling',['E-commerce is the transaction: a customer orders and pays online. E-business is wider and covers every process an organisation runs electronically, including supplier ordering, payroll, customer support and staff collaboration.'],['B2B: business to business.','B2C: business to consumer.','C2C: consumer to consumer.','M-commerce: e-commerce on a mobile device.']],
['Payments and trust',['HTTPS protects the connection and a payment processor handles card data so the merchant never stores it. Trust is the real currency: customers look for a padlock, a returns policy, a physical address, working contact details and independent reviews.','Selling online also changes work inside the organisation. Stock levels must update the website in real time, and fulfilment and finance must match what the processor reports, or the business will sell stock it does not have.'],['Two-factor authentication reduces account takeover.','Audit trails record who changed what and when.'],'Do not use e-business and e-commerce as synonyms. E-commerce is one part of e-business.']],
k:[['E-business','Every electronic business process, not just selling.'],['E-commerce','Buying and selling goods or services online.'],['B2B','Trading between two businesses.'],['Payment processor','Service that authorises and settles card payments for a merchant.']],
e:'Define e-commerce as the transaction and e-business as all electronic processes. Examiners look for that difference.'});

AL(2,1,['data-quality-and-backup','Data quality, backup and recovery',15,'Keeping organisational data accurate, and making sure it survives a failure.'],{
o:['Evaluate data against quality dimensions','Compare full, incremental and differential backups','Explain RPO, RTO and the 3-2-1 rule'],
s:[['What makes data good',['Accurate data matches reality. Complete data has no missing required fields. Consistent data uses the same codes across systems. Timely data is recent enough to act on. Unique data records each entity once.','Most quality problems start at input, so validation rules and coded drop-down lists save expensive clean-up later.']],
['Backup strategies',['A full backup copies everything: slow but simplest to restore. An incremental backup copies only what changed since the last backup of any kind: fastest to make, longest to restore. A differential backup copies everything changed since the last full backup: it grows each day but needs only the full backup and the latest differential to restore.','A backup that has never been restored is an assumption, not a safeguard.'],['Full: complete, slow, simple restore.','Incremental: smallest, fastest, longest restore.','Differential: grows daily, quicker restore.']],
['Recovery objectives',['The 3-2-1 rule means three copies, on two kinds of media, with one off-site. RPO is how much data you can afford to lose, measured in time. RTO is how quickly systems must be running again.'],null,'RAID survives a disk failure but is not a backup. Deleting a file deletes it from every disk at once.']],
k:[['Incremental backup','Copies data changed since the last backup of any kind.'],['Differential backup','Copies data changed since the last full backup.'],['RPO','Maximum acceptable data loss, measured in time.'],['RTO','Maximum acceptable downtime.']],
e:'Compare backup types on three points: how much they copy, how long a restore takes and how much storage they use.'});

AL(3,0,['design-history-and-movements','Design history and movements',14,'The movements that shaped modern design, and how to recognise and analyse their influence.'],{
o:['Place movements in roughly the right period','Identify characteristics of each movement in a design','Use history to explain why a design looks the way it does'],
s:[['From craft to industry',['Arts and Crafts (1860s) valued hand craft and natural motifs as a reaction against the machine. Art Nouveau (1890s) used flowing organic curves and ornament. The Bauhaus (1919) believed form follows function: geometric shapes, primary colours, sans-serif type and designs made for industry.'],['The Bauhaus is the pivot between craft and modern design.','De Stijl and Constructivism share its geometric vocabulary.']],
['Swiss style and beyond',['The International Typographic or Swiss style (1950s) added discipline: grids, asymmetric balance, generous white space, sans-serif type such as Helvetica and objective photography. Postmodernism (1970s to 1990s) pushed back with ornament, irony and broken rules.','Contemporary design draws on all of these, plus motion, brand systems, accessibility and sustainability.'],null,'Name the movement only if you can say what it believed and point to that belief in the work.']],
k:[['Bauhaus','German school (1919 to 1933) uniting art, craft and industry.'],['Swiss style','Grids, sans-serif type and asymmetric balance.'],['Postmodernism','Ornament, quotation and irony.'],['Grid system','Framework of columns, rows, margins and gutters.']],
e:'Name the movement, state what it believed, then point to where that belief shows in the design.'});

AL(3,2,['print-production','Print production: resolution, colour and finishing',15,'Preparing artwork so it prints the way it looked on screen.'],{
o:['Explain ppi, bleed and safe areas','Explain why RGB and CMYK differ','Describe proofing, stock and finishing'],
s:[['Resolution, bleed and safe area',['Print needs about 300 pixels per inch at final size. A 600-pixel-wide photo placed 6 inches wide gives only 100 ppi and will look soft even though it looked fine on a monitor. Vector artwork has no resolution, so logos and type should never be delivered as small bitmaps.','Trimming is never perfectly precise, so artwork extends 3 mm past the trim line (the bleed) while text stays inside the safe area.'],['300 ppi at final size for photographs.','Check effective resolution after scaling.','Trim marks show where to cut.']],
['Colour, stock and proofing',['Screens mix light (RGB) and printers mix ink (CMYK). Some vivid greens and blues cannot be printed, so convert early and expect the palette to shift. A spot colour is a pre-mixed ink for an exact brand colour.','Paper stock and finish change the result as much as the ink. A soft proof is on screen; a hard proof is printed on the real stock. Preflight checks fonts, resolution, colour mode and bleed before the file reaches the press.'],['Common finishes: matte or gloss laminate, spot UV, foil, emboss.','Paper weight is quoted in gsm.'],'Deliver a print-ready PDF with fonts embedded, and keep the editable source file in your archive.']],
k:[['Bleed','Artwork extending past the trim edge.'],['CMYK','Cyan, magenta, yellow and black ink model.'],['Spot colour','A pre-mixed ink used for exact colour.'],['Preflight','Mechanical check of a print file before printing.']],
e:'Resolution, colour mode, bleed and proofing are the four points almost every print question rewards.'});

AL(4,0,['storytelling-and-scripting','Storytelling and scriptwriting for the screen',14,'Structure, script format and shot planning before a single frame is recorded.'],{
o:['Structure a short film in three acts','Format a script correctly','Turn a script into a shot list and storyboard'],
s:[['Structure',['Most short films follow three acts: a character who wants something is pushed into action, obstacles escalate until the character must change or commit, and the want is resolved at a cost. In two minutes there is no room for long setup, so start close to the change.'],['Hook in the first five seconds.','One clear want per character.','Each obstacle costs more than the last.']],
['Script format and shot planning',['A screenplay uses slug lines in capitals (INT. CLASSROOM — DAY), action in the present tense, character names above their dialogue and only what can be seen or heard. One page is roughly one minute of screen time.','A shot list turns the script into decisions: shot number, size, camera movement and location, grouped by set-up so the crew is not moving the camera for every line. The storyboard draws those shots, and stick figures are fine if the framing and direction of action are clear.'],null,'Shoot coverage: for each scene record a wide, a medium, a close-up and cutaways.']],
k:[['Three-act structure','Setup, confrontation and resolution.'],['Slug line','Location and time of a scene, in capitals.'],['Shot list','Numbered plan of every shot needed.'],['Coverage','Range of shot sizes and angles recorded for the edit.']],
e:'If asked to storyboard a scene, label every frame with its shot size and camera movement.'});

AL(4,2,['social-media-content-strategy','Social media and content strategy',13,'Planning content that fits the platform, the audience and the goal, then measuring it.'],{
o:['Plan content against an audience and a goal','Adapt one idea to several formats','Read engagement metrics and act on them'],
s:[['Start with the goal',['A content strategy starts with one measurable goal: awareness, sign-ups, sales or retention. Each post is judged against that goal, not against likes. Define the audience concretely: age, device, what they already watch and why they would care.'],['Awareness: reach and views.','Conversion: link clicks and purchases.','Retention: replies and repeat engagement.']],
['Format, pillars and measurement',['The same idea is rebuilt for each platform: 9:16 vertical for stories and reels, 1:1 or 4:5 for a feed, 16:9 for long video. The hook decides whether the rest is seen, so put the payoff in the first two seconds, and burn captions in because most viewing is muted.','Content pillars are three to five recurring themes that keep a feed coherent. Engagement rate is interactions divided by reach, times 100. Compare it with your own typical posts, not with a viral account.'],['Test one variable at a time.','Watch time matters more than raw views for video.'],'Link every claim about a platform to a reason: vertical video suits one-handed phone use; muted autoplay explains why captions matter.']],

return`${top}<div class="${box} mt-6 max-w-2xl p-6 sm:p-8"><p class="text-sm text-muted-foreground">Your score</p><p class="font-display text-5xl font-semibold">${s}<span class="text-2xl text-muted-foreground"> / ${z.length}</span></p><p class="mt-3">${m}</p><div class="mt-6 flex flex-wrap gap-3"><button onclick="app.innerHTML=quizStart(${QS.n})" class="rounded-full bg-primary px-5 py-3 text-sm font-semibold text-white">Try again</button><a href="#course-${c.id}" class="rounded-full border border-border px-5 py-3 text-sm font-semibold">Revise ${c.t}</a><a href="#quizzes" class="rounded-full border border-border px-5 py-3 text-sm font-semibold">More quizzes</a></div></div>`}
const q=z[QS.i],pk=QS.pk;
return`${top}<div class="mt-6 h-2 max-w-2xl overflow-hidden rounded-full bg-muted"><div class="h-full rounded-full bg-gradient-to-r ${A[c.a][0]}" style="width:${Math.round(QS.i/z.length*100)}%"></div></div>

${pk!=null?`<div class="mt-5 rounded-2xl bg-muted p-4 text-sm" aria-live="polite"><b>${pk===q[2]?'Correct.':'Not quite.'}</b> ${esc(q[3])}</div><button onclick="nextQ()" class="mt-5 rounded-full bg-primary px-5 py-3 text-sm font-semibold text-white">${QS.i<z.length-1?'Next question':'See my score'}</button>`:''}</div>`}
function pick(j){if(QS.pk!=null)return;QS.pk=j;if(j===QZ[QS.n][QS.i][2])QS.sc++;app.innerHTML=quizHTML()}
function nextQ(){QS.i++;QS.pk=null;if(QS.i>=QZ[QS.n].length){const p=gp(),k='quiz-'+QS.n;if(p[k]==null||QS.sc>p[k]){p[k]=QS.sc;sp(p)}}app.innerHTML=quizHTML();scrollTo(0,0)}
function caseView(n){const s=S[n],k=CS[n],c=co(s[0]);
return`<a href="#case-studies" class="text-sm text-muted-foreground">All case studies</a><div class="${box} mt-4">${strip(c)}<div class="p-6 sm:p-8">${chip(c)}<h1 class="mt-4 text-3xl font-semibold sm:text-4xl">${s[1]}</h1><p class="mt-3 text-lg text-muted-foreground">${s[2]}</p></div></div>
<div class="mt-8 max-w-2xl space-y-4">${k.sc.map(p=>`<p class="text-[17px] leading-relaxed">${p}</p>`).join('')}</div>
<div class="mt-8 max-w-2xl rounded-2xl border border-border bg-muted p-5"><p class="text-sm font-semibold">Key facts</p><ul class="mt-3 space-y-2 text-sm">${k.f.map(x=>`<li class="flex gap-2"><span class="${A[c.a][2]}">•</span>${x}</li>`).join('')}</ul></div>
<h2 class="mt-12 text-xl font-semibold">Your tasks</h2><p class="mt-2 max-w-2xl text-sm text-muted-foreground">Write your own answer first, then open the model answer and compare.</p>
<div class="mt-5 max-w-2xl space-y-3">${k.q.map((q,i)=>`<details class="${box}"><summary class="cursor-pointer p-5 font-semibold"><span class="${A[c.a][2]}">Task ${i+1}.</span> ${q[0]}</summary><div class="border-t border-border bg-muted p-5 text-[15px] leading-relaxed">${q[1]}</div></details>`).join('')}</div>
<h2 class="mt-12 text-xl font-semibold">Review the theory</h2><div class="mt-4 flex flex-wrap gap-3">${k.l.map(key=>{const t=T.find(x=>x.k===key);return t?`<a href="#lesson-${key}" class="rounded-full border border-border px-4 py-2 text-sm font-semibold">${t.t}</a>`:''}).join('')}</div>`}
function demoUI(id){
const inp='mt-2 block w-full max-w-xs rounded-xl border border-border bg-card p-3',btn='rounded-full border border-border px-4 py-2 text-sm font-semibold';
if(id==='sorting')return`<div class="flex flex-wrap items-end gap-x-6 gap-y-4"><div><label class="text-sm font-semibold" for="alg">Algorithm</label><select id="alg" class="${inp}"><option value="bubble">Bubble sort</option><option value="selection">Selection sort</option><option value="insertion">Insertion sort</option></select></div><div><label class="text-sm font-semibold" for="n">Items: <span id="nv">12</span></label><input id="n" type="range" min="6" max="30" value="12" class="mt-3 block w-40"></div><div><label class="text-sm font-semibold" for="spd">Speed</label><input id="spd" type="range" min="1" max="5" value="3" class="mt-3 block w-32"></div></div>
<div class="mt-4 flex flex-wrap gap-2"><button id="play" class="${btn} bg-primary text-white">Play</button><button id="step" class="${btn}">Step</button><button id="reset" class="${btn}">Reset</button><button id="shuffle" class="${btn}">New data</button></div>
<div id="bars" class="${bx} mt-6 flex h-64 items-end gap-1" role="img" aria-label="Bar chart of the data being sorted"></div>
<p class="mt-3 text-xs text-muted-foreground"><span class="text-amber-500">■</span> being compared <span class="ml-3 text-emerald-500">■</span> in final position</p>
<div class="mt-4 grid grid-cols-3 gap-3 text-center"><div class="${bx}"><p class="text-xs text-muted-foreground">Comparisons</p><p id="sc" class="font-mono text-xl">0</p></div><div class="${bx}"><p class="text-xs text-muted-foreground">Swaps / shifts</p><p id="sw" class="font-mono text-xl">0</p></div><div class="${bx}"><p class="text-xs text-muted-foreground">Step</p><p id="sp" class="font-mono text-xl">0</p></div></div>
<p id="msg" class="mt-4 min-h-[3rem] text-sm font-medium" aria-live="polite"></p><p id="note" class="mt-2 text-sm text-muted-foreground"></p>`;
if(id==='colour')return`<div class="grid gap-8 md:grid-cols-2"><div class="space-y-5">
<div><label class="text-sm font-semibold" for="r">Red: <span id="rv">20</span></label><input id="r" type="range" min="0" max="255" value="20" class="mt-2 block w-full"></div>
<div><label class="text-sm font-semibold" for="g">Green: <span id="gv">120</span></label><input id="g" type="range" min="0" max="255" value="120" class="mt-2 block w-full"></div>
<div><label class="text-sm font-semibold" for="b">Blue: <span id="bv">160</span></label><input id="b" type="range" min="0" max="255" value="160" class="mt-2 block w-full"></div>
<div><p class="text-sm font-semibold">Try mixing light</p><div class="mt-2 flex flex-wrap gap-2"><button class="${btn}" onclick="setC(255,255,0)">Red + green</button><button class="${btn}" onclick="setC(0,255,255)">Green + blue</button><button class="${btn}" onclick="setC(255,0,255)">Red + blue</button><button class="${btn}" onclick="setC(255,255,255)">All three</button><button class="${btn}" onclick="setC(0,0,0)">None</button></div><p class="mt-3 text-sm text-muted-foreground">Red and green light together make yellow. That is additive mixing: more light means a brighter colour.</p></div></div>
<div><div id="sw" class="flex h-40 flex-wrap items-center justify-center gap-6 rounded-2xl border border-border text-2xl font-bold"><span style="color:#fff">White text</span><span style="color:#000">Black text</span></div><div id="o" class="mt-4 grid gap-3 sm:grid-cols-2"></div></div></div>`;
if(id==='file-size')return`<div class="grid gap-5 sm:grid-cols-2"><div><label class="text-sm font-semibold" for="w">Width (pixels)</label><input id="w" type="number" min="1" value="1000" class="${inp}"></div><div><label class="text-sm font-semibold" for="h">Height (pixels)</label><input id="h" type="number" min="1" value="800" class="${inp}"></div>
<div><label class="text-sm font-semibold" for="d">Colour depth</label><select id="d" class="${inp}"><option value="1">1-bit (black and white)</option><option value="8">8-bit (256 colours)</option><option value="16">16-bit</option><option value="24" selected>24-bit (true colour)</option><option value="32">32-bit (true colour + transparency)</option></select></div>
<div><label class="text-sm font-semibold" for="c">Compression</label><select id="c" class="${inp}"><option value="1">None (raw bitmap)</option><option value="2">Lossless, about 2:1 (PNG)</option><option value="10">Lossy, about 10:1 (JPEG)</option></select></div></div>
<div class="mt-4 flex flex-wrap gap-2"><button class="${btn}" onclick="setS(1920,1080)">HD screen</button><button class="${btn}" onclick="setS(4000,3000)">Phone photo</button><button class="${btn}" onclick="setS(728,90)">Web banner</button><button class="${btn}" onclick="setS(2480,3508)">A4 at 300 dpi</button></div>
<div id="wk" class="${bx} mt-6 font-mono text-sm break-words"></div><div id="o" class="mt-4 grid gap-3 sm:grid-cols-2"></div>
<p class="mt-4 text-sm text-muted-foreground">Compression ratios are typical examples. Real results depend on the picture. Sizes use 1 KB = 1024 bytes.</p>`}
function sortSteps(alg,src){
const a=src.slice(),n=a.length,st=[],done=new Set();let c=0,s=0;
const snap=(h,t)=>st.push({a:a.slice(),h:h,c:c,s:s,d:[...done],t:t});
snap([],'Unsorted data. Press Step or Play.');
if(alg==='bubble'){
for(let i=0;i<n-1;i++){let moved=false;
for(let j=0;j<n-1-i;j++){c++;const x=a[j],y=a[j+1];
if(x>y){a[j]=y;a[j+1]=x;s++;moved=true;snap([j,j+1],x+' > '+y+': swap them.')}
else snap([j,j+1],x+' ≤ '+y+': leave them.')}
done.add(n-1-i);
if(!moved)break}}
else if(alg==='selection'){
for(let i=0;i<n-1;i++){let m=i;
for(let j=i+1;j<n;j++){c++;snap([m,j],'Looking for the smallest: compare '+a[m]+' with '+a[j]+'.');if(a[j]<a[m])m=j}
if(m!==i){const x=a[i];a[i]=a[m];a[m]=x;s++;snap([i,m],'Swap the smallest value ('+a[i]+') into position '+(i+1)+'.')}
done.add(i)}}
else{
done.add(0);
for(let i=1;i<n;i++){const key=a[i];let j=i-1;
snap([i],'Pick up '+key+' and insert it into the sorted part.');
while(j>=0){c++;
if(a[j]>key){const v=a[j];a[j+1]=v;s++;snap([j,j+1],v+' > '+key+': shift it right.');j--}
else{snap([j],a[j]+' ≤ '+key+': found the spot.');break}}
a[j+1]=key;done.add(i);snap([j+1],'Place '+key+' at position '+(j+2)+'.')}}
for(let k=0;k<n;k++)done.add(k);
snap([],'Sorted. '+c+' comparisons and '+s+' swaps or shifts.');
return st}
function initSort(){
let data=[],steps=[],pos=0;
const bars=$('#bars'),alg=$('#alg'),nIn=$('#n'),spd=$('#spd'),play=$('#play');
const NOTE={bubble:'Bubble sort compares neighbours and swaps them if they are out of order, so the largest value “bubbles” to the end on each pass. Worst case O(n²); with an early exit it needs only O(n) if the data is already sorted.',selection:'Selection sort finds the smallest remaining value and swaps it into place. It always makes about n²/2 comparisons but never more than n − 1 swaps. O(n²) in every case.',insertion:'Insertion sort builds a sorted section on the left by inserting each new value into its correct position. O(n²) in the worst case, but close to O(n) on nearly sorted data.'};
const delay=()=>[700,350,170,80,25][+spd.value-1];
const stop=()=>{clearInterval(TM);TM=null;play.textContent='Play'};
const draw=()=>{const s=steps[pos],mx=Math.max(...data);
bars.innerHTML=s.a.map((v,i)=>{const hl=s.h.includes(i),dn=s.d.includes(i),n=s.a.length,fs=n<=14?'text-sm':n<=20?'text-xs':n<=26?'text-[10px]':'text-[8px]';return`<div class="flex h-full min-w-0 flex-1 flex-col items-center justify-end" title="${v}"><span class="${fs} mb-1 font-semibold leading-none ${hl?'text-amber-500':dn?'text-emerald-600':'text-foreground'}">${v}</span><div class="w-full rounded-t-md ${hl?'bg-amber-400':dn?'bg-emerald-500':'bg-blue-500'}" style="height:${Math.round(v/mx*84)}%"></div></div>`}).join('');
$('#sc').textContent=s.c;$('#sw').textContent=s.s;$('#sp').textContent=pos+' / '+(steps.length-1);$('#msg').textContent=s.t};
const build=()=>{stop();steps=sortSteps(alg.value,data);pos=0;$('#note').textContent=NOTE[alg.value];draw()};
const fresh=()=>{const n=+nIn.value;data=Array.from({length:n},()=>Math.floor(Math.random()*90)+10);build()};
const run=()=>{clearInterval(TM);TM=setInterval(()=>{if(pos>=steps.length-1){stop();return}pos++;draw()},delay())};
nIn.oninput=()=>{$('#nv').textContent=nIn.value;fresh()};
alg.onchange=build;$('#shuffle').onclick=fresh;$('#reset').onclick=build;
$('#step').onclick=()=>{stop();if(pos<steps.length-1){pos++;draw()}};
spd.oninput=()=>{if(TM)run()};
play.onclick=()=>{if(TM){stop();return}if(pos>=steps.length-1)pos=0;play.textContent='Pause';run()};
fresh()}
function setC(R,G,B){$('#r').value=R;$('#g').value=G;$('#b').value=B;$('#r').oninput()}
function initColour(){
const r=$('#r'),g=$('#g'),b=$('#b');
const lin=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)};
const hx=v=>v.toString(16).padStart(2,'0').toUpperCase();
const ver=x=>x>=7?'AAA, excellent':x>=4.5?'AA, passes for body text':x>=3?'Large text only':'Fails';
const f=()=>{const R=+r.value,G=+g.value,B=+b.value;
$('#rv').textContent=R;$('#gv').textContent=G;$('#bv').textContent=B;
const L=0.2126*lin(R)+0.7152*lin(G)+0.0722*lin(B),cw=1.05/(L+0.05),cb=(L+0.05)/0.05;
const k=1-Math.max(R,G,B)/255,cm=k>=1?[0,0,0]:[(1-R/255-k)/(1-k),(1-G/255-k)/(1-k),(1-B/255-k)/(1-k)];
$('#sw').style.background='rgb('+R+','+G+','+B+')';
$('#o').innerHTML=[['Hex code','#'+hx(R)+hx(G)+hx(B)],['RGB','rgb('+R+', '+G+', '+B+')'],['CMYK (approx.)',[...cm,k].map(v=>Math.round(v*100)+'%').join(' · ')],['Contrast with white text',cw.toFixed(2)+':1 · '+ver(cw)],['Contrast with black text',cb.toFixed(2)+':1 · '+ver(cb)]].map(x=>`<div class="${bx}"><p class="text-sm text-muted-foreground">${x[0]}</p><p class="mt-1 font-mono text-base break-words">${x[1]}</p></div>`).join('')};
r.oninput=g.oninput=b.oninput=f;f()}
function setS(W,H){$('#w').value=W;$('#h').value=H;$('#w').oninput()}
function initSize(){
const w=$('#w'),h=$('#h'),d=$('#d'),c=$('#c'),o=$('#o'),wk=$('#wk');
const fm=x=>x>=1048576?(x/1048576).toFixed(2)+' MB':x>=1024?(x/1024).toFixed(1)+' KB':Math.round(x)+' bytes';
const nu=x=>Math.round(x).toLocaleString('en-US');
const f=()=>{const W=+w.value,H=+h.value,D=+d.value,C=+c.value;
if(!(W>0&&H>0)){wk.textContent='Enter a width and height above zero.';o.innerHTML='';return}
const px=W*H,bits=px*D,by=bits/8,cby=by/C;
wk.textContent=nu(W)+' × '+nu(H)+' × '+D+' = '+nu(bits)+' bits ÷ 8 = '+nu(by)+' bytes';
o.innerHTML=[['Total pixels',nu(px)],['Uncompressed size',fm(by)],['After compression',fm(cby)],['Print size at 300 dpi',(W/300).toFixed(1)+' × '+(H/300).toFixed(1)+' in ('+(W/300*2.54).toFixed(1)+' × '+(H/300*2.54).toFixed(1)+' cm)']].map(x=>`<div class="${bx}"><p class="text-sm text-muted-foreground">${x[0]}</p><p class="mt-1 font-mono text-base break-words">${x[1]}</p></div>`).join('')};
[w,h,d,c].forEach(x=>{x.oninput=f;x.onchange=f});f()}

function tog(k){const p=gp();p[k]=!p[k];sp(p);route()}
const bx='rounded-2xl bg-muted p-4';
function demo(id){const d=D.find(x=>x[0]===id),th=d[5]?`<a href="#lesson-${d[5]}" class="rounded-full bg-primary px-5 py-3 text-sm font-semibold text-white">Read the theory</a>`:'';
const ui=demoUI(id)||{'number-bases':`<label class="text-sm font-semibold" for="i">Denary number</label><input id="i" type="number" min="0" value="13" class="mt-2 block w-full max-w-xs rounded-xl border border-border bg-card p-3"><div id="o" class="mt-6 grid gap-3 sm:grid-cols-3"></div>`,
cipher:`<label class="text-sm font-semibold" for="i">Message</label><textarea id="i" rows="3" class="mt-2 block w-full rounded-xl border border-border bg-card p-3">Hello Cipher and Canvas</textarea><label class="mt-5 block text-sm font-semibold" for="s">Shift: <span id="sv">3</span></label><input id="s" type="range" min="1" max="25" value="3" class="mt-2 w-full max-w-sm"><div id="o" class="${bx} mt-6 font-mono"></div>`,
'logic-gates':`<div class="flex gap-6 text-sm font-semibold"><label><input id="a" type="checkbox"> Input A</label><label><input id="b" type="checkbox"> Input B</label></div><div id="o" class="mt-6 grid gap-3 sm:grid-cols-3"></div>`}[id];
return`<a href="#demos" class="text-sm text-muted-foreground">All demos</a><h1 class="mt-4 text-3xl font-semibold sm:text-4xl">${d[1]}</h1><p class="mt-3 max-w-2xl text-lg text-muted-foreground">${d[2]}</p><div class="${box} mt-8 p-6">${ui}</div><div class="mt-8 flex flex-wrap gap-3">${th}<a href="#demos" class="rounded-full border border-border px-5 py-3 text-sm font-semibold">Try another demo</a></div>`}
function init(id){if(id==='sorting')return initSort();if(id==='colour')return initColour();if(id==='file-size')return initSize();const i=$('#i'),o=$('#o');let f;
if(id==='number-bases')f=()=>{const n=parseInt(i.value);o.innerHTML=isNaN(n)||n<0?'Enter a whole number, 0 or above.':[['Binary',n.toString(2)],['Octal',n.toString(8)],['Hexadecimal',n.toString(16).toUpperCase()]].map(r=>`<div class="${bx}"><p class="text-sm text-muted-foreground">${r[0]}</p><p class="mt-1 font-mono text-xl break-all">${r[1]}</p></div>`).join('')};
if(id==='cipher')f=()=>{const k=+$('#s').value;$('#sv').textContent=k;o.textContent=i.value.replace(/[a-z]/gi,c=>{const b=c<'a'?65:97;return String.fromCharCode((c.charCodeAt(0)-b+k)%26+b)})};
if(id==='logic-gates'){const a=$('#a'),b=$('#b');f=()=>{const x=+a.checked,y=+b.checked,g=[['AND',x&y],['OR',x|y],['NOT A',+!x],['XOR',x^y],['NAND',+!(x&y)],['NOR',+!(x|y)]];o.innerHTML=g.map(r=>`<div class="${bx} flex justify-between ${r[1]?'ring-2 ring-emerald-500':''}"><b>${r[0]}</b><span class="font-mono">${r[1]}</span></div>`).join('')};a.onchange=b.onchange=f}
if(id==='cipher')$('#s').oninput=f;if(i)i.oninput=f;f()}
function route(){clearInterval(TM);TM=null;const h=location.hash.slice(1)||'home';let v,c,t;
if(h.startsWith('course-'))v=(c=C.find(x=>'course-'+x.id===h))?course(c):nf();
else if(h.startsWith('lesson-'))v=(t=T.find(x=>'lesson-'+x.k===h))?lesson(t):nf();
else if(h.startsWith('demo-')&&live.includes(h.slice(5)))v=demo(h.slice(5));
else if(/^quiz-\d+$/.test(h)&&QZ[+h.slice(5)])v=quizStart(+h.slice(5));
else if(/^case-\d+$/.test(h)&&CS[+h.slice(5)])v=caseView(+h.slice(5));
else v=views[h]?views[h]():nf();
app.innerHTML=v;if(h.startsWith('demo-')&&live.includes(h.slice(5)))init(h.slice(5))}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});route();
